<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Saigonesee Café Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --tile:#1F6B5C; --tile2:#26806C; --stool:#E0442F; --sun:#F2B632;
  --coffee:#4A2C1D; --paper:#FFF8EC; --ink:#2B1A10; --wood:#8A5A3B;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --tile:#164D43; --tile2:#1B5C50; --paper:#F3E6CF; --wood:#6E4730; }
}
:root[data-theme="dark"]{ --tile:#164D43; --tile2:#1B5C50; --paper:#F3E6CF; --wood:#6E4730; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--tile)}
body{
  height:100%;margin:0;color:var(--ink);
  font-family:"Baloo 2",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background-color:var(--tile);
  background-image:
    radial-gradient(circle at 50% 50%, var(--sun) 0 7%, transparent 7.5%),
    radial-gradient(circle at 0 0, var(--paper) 0 9%, transparent 9.5%),
    radial-gradient(circle at 100% 0, var(--paper) 0 9%, transparent 9.5%),
    radial-gradient(circle at 0 100%, var(--paper) 0 9%, transparent 9.5%),
    radial-gradient(circle at 100% 100%, var(--paper) 0 9%, transparent 9.5%),
    conic-gradient(from 45deg, var(--tile2) 0 25%, var(--tile) 0 50%, var(--tile2) 0 75%, var(--tile) 0);
  background-size:72px 72px;
  -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;
  overflow:hidden;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;position:relative}

/* HUD */
.hud{display:flex;align-items:center;gap:8px;padding:10px 12px 6px}
.pill{background:var(--paper);border:3px solid var(--coffee);border-radius:999px;padding:2px 12px;font-weight:800;line-height:1.5;white-space:nowrap}
.day{display:flex;flex-direction:column;line-height:1.05;background:var(--stool);color:var(--paper);border:3px solid var(--coffee);border-radius:14px;padding:4px 10px}
.day b{font-size:15px}.day span{font-size:13px;font-weight:700;opacity:.9}
.money{font-size:18px}
.stars{font-size:15px;color:var(--coffee)}
.stars i{font-style:normal;color:var(--stool)}
.hud .sp{flex:1}
.iconbtn{width:42px;height:42px;border-radius:50%;background:var(--paper);border:3px solid var(--coffee);font-size:18px;font-weight:800;box-shadow:0 3px 0 var(--coffee)}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--coffee)}

/* awning */
.awning{margin:4px 12px 0;height:22px;border-radius:10px 10px 0 0;
  background:repeating-linear-gradient(90deg,var(--stool) 0 28px,var(--paper) 28px 56px);
  border:3px solid var(--coffee);border-bottom:none;position:relative}
.sign{position:absolute;left:50%;top:-4px;transform:translateX(-50%);background:var(--coffee);color:var(--sun);
  font-weight:800;font-size:20px;padding:0 16px;border-radius:10px;letter-spacing:.5px;line-height:1.4}

/* street */
.street{margin:0 12px;flex:1;min-height:170px;display:grid;gap:8px;padding:12px 8px 0;
  background:rgba(0,0,0,.18);border-left:3px solid var(--coffee);border-right:3px solid var(--coffee);align-items:end}
.slot{display:flex;justify-content:center;align-items:flex-end;min-height:150px}
.cust{border:none;background:none;padding:0;display:flex;flex-direction:column;align-items:center;width:100%;max-width:130px;animation:walkin .35s ease-out}
@keyframes walkin{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.cust.leave{animation:leave .5s ease-in forwards}
@keyframes leave{to{transform:translateY(30px);opacity:0}}
.bubble{background:var(--paper);border:3px solid var(--coffee);border-radius:14px;padding:4px 6px 5px;width:100%;position:relative;text-align:center}
.bubble::after{content:"";position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);border:7px solid transparent;border-top-color:var(--coffee)}
.bubble .it{font-size:26px;line-height:1.1}
.bubble .nm{font-size:12.5px;font-weight:800;line-height:1.15}
.bubble .mini{font-size:12px;letter-spacing:1px;margin-top:1px}
.face{font-size:44px;line-height:1;margin-top:10px}
.bar{width:74%;height:8px;border-radius:6px;background:rgba(0,0,0,.35);margin-top:4px;overflow:hidden;border:2px solid var(--coffee)}
.bar>div{height:100%;background:var(--sun);width:100%}
.bar>div.low{background:var(--stool)}
.cust.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.cust.match .bubble{background:var(--sun)}

/* counter */
.counter{margin:0 6px;background:var(--wood);border:3px solid var(--coffee);border-radius:12px;padding:8px;display:flex;gap:8px;align-items:center;box-shadow:0 5px 0 var(--coffee)}
.tray{flex:1;min-height:52px;background:var(--paper);border:3px dashed var(--coffee);border-radius:12px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:4px 8px}
.tray .empty{font-size:14px;font-weight:700;opacity:.6}
.chip{border:none;background:none;font-size:26px;padding:0 2px;line-height:1}
.tray .res{margin-left:auto;font-weight:800;font-size:14px;background:var(--sun);border-radius:8px;padding:0 8px}
.trash{background:var(--stool);color:var(--paper);border:3px solid var(--coffee);border-radius:12px;font-weight:800;padding:8px 12px;box-shadow:0 3px 0 var(--coffee)}
.trash:active{transform:translateY(2px);box-shadow:0 1px 0 var(--coffee)}

/* station */
.station{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px 12px 8px}
.ing{background:var(--paper);border:3px solid var(--coffee);border-radius:16px;box-shadow:0 4px 0 var(--coffee);padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center}
.ing .e{font-size:28px;line-height:1.1}
.ing .n{font-size:12.5px;font-weight:700;line-height:1.1}
.ing:active{transform:translateY(3px);box-shadow:0 1px 0 var(--coffee)}
.ing.on{background:var(--sun)}
.ing{position:relative}
.ing .cnt{position:absolute;top:-8px;right:-6px;background:var(--coffee);color:var(--paper);font-size:12px;font-weight:800;border-radius:999px;min-width:22px;padding:0 5px;line-height:20px}
.ing.low .cnt{background:var(--stool)}
.ing.out{opacity:.45}
.warn{background:#FCE3DD;border:2px solid var(--stool);border-radius:10px;padding:4px 8px;font-weight:700;font-size:14px;margin-top:8px}
.tag{font-size:11px;font-weight:800;color:var(--stool)}
.crew{display:none;gap:6px;margin:0 12px;padding:6px 8px;background:rgba(0,0,0,.25);border-left:3px solid var(--coffee);border-right:3px solid var(--coffee)}
.crew.has{display:flex}
.worker{flex:1;min-width:0;background:var(--paper);border:2px solid var(--coffee);border-radius:10px;padding:2px 6px;display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700;line-height:1.2}
.worker .f{font-size:22px}.worker .w{flex:1;min-width:0}
.worker .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.worker .b{height:6px;background:rgba(0,0,0,.15);border-radius:4px;overflow:hidden;margin-top:2px}
.worker .b div{height:100%;background:var(--tile);width:0}
.tabs{display:flex;gap:6px;margin:10px 0 6px;flex-wrap:wrap}
.tabs button{flex:1;border:3px solid var(--coffee);border-radius:10px;background:var(--paper);font-weight:800;padding:2px 6px;white-space:nowrap}
.tabs.sm button{font-size:13px;border-width:2px}
.tabs .on{background:var(--sun)}
.fc{font-size:28px}
.acts{display:flex;flex-direction:column;gap:4px;align-items:stretch}
.acts select{font:inherit;font-weight:700;font-size:13px;border:2px solid var(--coffee);border-radius:8px;background:var(--paper);color:var(--ink);padding:1px 2px}
.upg button.fire{background:var(--paper);font-size:13px}
.note{font-size:13px;opacity:.8}
.sttabs{margin:10px 12px 0}
.sttabs button{font-size:13.5px}
.station.dense{grid-template-columns:repeat(5,1fr);gap:6px}
.dense .ing{border-radius:12px;padding:4px 1px 3px}
.dense .ing .e{font-size:22px}
.dense .ing .n{font-size:10.5px}
.station{padding-top:10px}
#app>.station{flex:0 1 auto;max-height:92px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  margin:6px 8px 8px;padding:12px 6px 10px;background:rgba(0,0,0,.18);border:3px solid var(--coffee);border-radius:14px;scrollbar-width:thin}
#app>.station::-webkit-scrollbar{width:5px}#app>.station::-webkit-scrollbar-thumb{background:var(--paper);border-radius:4px}
.sttabs{flex:0 0 auto}
.sttabs .bk{flex:0 0 44px!important}
.street{min-height:0;overflow:hidden;padding-top:8px}
.crew.has{padding:4px 6px;gap:4px}
.worker{padding:1px 5px;font-size:11.5px}
.worker .f{font-size:18px}
.queue{display:none;margin:0 12px;padding:3px 8px;background:rgba(0,0,0,.35);border-left:3px solid var(--coffee);border-right:3px solid var(--coffee);align-items:center;gap:5px;min-height:34px;flex-wrap:nowrap;overflow:hidden}
.queue.has{display:flex}
.ql{font-size:12px;font-weight:800;color:var(--paper);white-space:nowrap;margin-right:2px}
.qp{display:flex;flex-direction:column;align-items:center;font-size:22px;line-height:1;animation:walkin .3s ease-out}
.qp i{display:block;width:24px;height:4px;background:rgba(0,0,0,.4);border-radius:3px;margin-top:2px;overflow:hidden}
.qp b{display:block;height:100%;width:100%;background:var(--sun)}
.qp.qreg i{outline:1px solid var(--sun)}
.counter{padding:6px 8px}
.tray{min-height:44px}
.trash{padding:6px 12px}
.sttabs{margin-top:8px}
.pr{display:flex;align-items:center;gap:4px}
.pr button{min-width:34px!important;padding:2px 0!important}
.pr b{min-width:54px;text-align:center}
.vi{font-size:12px;opacity:.7;font-weight:600}
.ic{width:1.15em;height:1.15em;display:inline-block;vertical-align:-.2em}
#card .tabs:not(.sm){display:grid;grid-template-columns:repeat(3,1fr)}
#card .tabs:not(.sm) button{font-size:13px;padding:2px 2px}
.cust.regular .bubble{border-color:var(--sun);box-shadow:0 0 0 2px var(--coffee)}
.rev{background:#fff;border:2px solid rgba(74,44,29,.25);border-radius:10px;padding:4px 8px;margin:4px 0;font-size:14px;line-height:1.35}
.rev b{color:var(--stool)}
.cater{display:none;margin:0 12px;padding:4px 8px;background:var(--sun);border:3px solid var(--coffee);border-top:none;text-align:left;font-size:12.5px;line-height:1.35;color:var(--ink)}
.cater.has{display:block}
.cater .ci{display:inline-block;background:var(--paper);border-radius:6px;padding:0 5px;margin:1px 2px 0 0;font-weight:800}
.cater .ci.ok{background:#BFE3C9}
.cust.deliv .bubble{border-style:dashed}
.cust.inf .bubble{border-color:#C13584;box-shadow:0 0 0 2px #F7B6D2}
.street.dark{filter:brightness(.45)}
.street.rows2{grid-auto-rows:1fr;gap:4px 6px;padding-top:4px}
.street.rows2 .slot{min-height:0}
.street.rows2 .face{font-size:24px;margin-top:6px}
.street.rows2 .bar{height:6px;margin-top:2px}
.street.rows2 .bubble{padding:2px 2px 3px;border-width:2px;border-radius:10px}
.street.rows2 .bubble::after{bottom:-8px;border-width:5px}
.street.rows2 .who{font-size:9.5px}
.street.rows2 .oi .it{font-size:15px;line-height:1}
.street.rows2 .oi .nm{font-size:9px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.street.rows2 .oi{display:flex;flex-direction:column;align-items:center;min-width:0}
.street.rows2 .oi .nm{max-width:100%}
.street.rows2 .oi .mini{display:none}
.street.rows2 .oi+.oi{margin-top:0;padding-top:1px}
.queue{flex-shrink:0}

.bubble .who{font-size:11px;font-weight:800;color:var(--tile);line-height:1.1;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oi{border-radius:8px;padding:1px 0}
.oi+.oi{border-top:2px dotted rgba(74,44,29,.3);margin-top:2px;padding-top:3px}
.oi.byc{background:#DDF0E9}
.oi.done{opacity:.4}
.oi .by{font-size:10.5px;font-weight:800;color:var(--tile);line-height:1.1}
.cust.two .it{font-size:20px}
.cust.two .nm{font-size:11px}
.cust.two .mini{font-size:10px;letter-spacing:0}
.cust.many .oi{text-align:center}
.cust.many .oi .it{font-size:16px;line-height:1}
.cust.many .oi .nm{font-size:9.5px;line-height:1.1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cust.many .oi .mini{display:none}
.cust.many .oi .by{font-size:9px}
.cust.many .oi+.oi{margin-top:1px;padding-top:2px}
.slot{min-width:0}
.cust{min-width:0}
.cust.many .face{font-size:30px;margin-top:8px}
.street.many .nm{font-size:10.5px}
.street.many .it{font-size:20px}
.street.many .mini{font-size:9.5px;letter-spacing:0}
.street.many .face{font-size:32px}
.street.many .bubble{padding:3px 3px 4px}
.worker{flex:1 1 30%}
.crew.has{flex-wrap:wrap}
.srow{flex-wrap:wrap}
.upg .arow,.upg .posb{flex:1 1 100%!important}
.arow{display:flex;flex-wrap:wrap;gap:4px;width:100%;padding-left:38px;margin-top:4px}
.arow button,.arow select{flex:1 1 30%;min-width:0!important;background:var(--paper)!important;font-size:12.5px;padding:2px 4px!important;border-width:2px!important;border:2px solid var(--coffee);border-radius:8px;font-weight:800;color:var(--ink);font-family:inherit}
.arow button:disabled{opacity:.4}
.posb{display:flex;gap:4px;width:100%;padding-left:38px}
.posb button{flex:1;min-width:0!important;background:var(--paper)!important;font-size:12.5px;padding:1px 2px!important;border-width:2px!important}
.posb button.on{background:var(--sun)!important}
.sched{width:100%;border-collapse:collapse;margin:6px 0 8px;font-size:13px;font-weight:700;table-layout:fixed}
.sched th{background:var(--coffee);color:var(--paper);padding:3px;font-size:12.5px}
.sched td{border:2px solid var(--coffee);padding:4px;vertical-align:top;line-height:1.35}
.foot{display:flex;justify-content:center;padding:0 12px 10px}
.book{background:var(--paper);border:3px solid var(--coffee);border-radius:999px;padding:4px 18px;font-weight:800;box-shadow:0 3px 0 var(--coffee)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(20,12,6,.55);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal.show{display:flex}
.card{background:var(--paper);border:4px solid var(--coffee);border-radius:22px;max-width:420px;width:100%;max-height:88%;overflow:auto;padding:18px 18px 16px;box-shadow:0 8px 0 var(--coffee)}
.card h2{margin:0 0 4px;font-size:28px;line-height:1.1;color:var(--stool)}
.card p{margin:6px 0;line-height:1.45}
.big{display:block;width:100%;margin-top:12px;background:var(--stool);color:var(--paper);border:3px solid var(--coffee);border-radius:14px;font-size:20px;font-weight:800;padding:8px;box-shadow:0 4px 0 var(--coffee)}
.big.alt{background:var(--paper);color:var(--ink)}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 var(--coffee)}
.stat{display:flex;justify-content:space-between;font-weight:700;padding:2px 0;border-bottom:2px dotted rgba(74,44,29,.3)}
.upg{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:2px dotted rgba(74,44,29,.3)}
.upg div{flex:1;line-height:1.2}.upg small{opacity:.75;font-weight:600}
.upg button{background:var(--sun);border:3px solid var(--coffee);border-radius:10px;font-weight:800;padding:2px 10px;min-width:70px}
.upg button:disabled{opacity:.4}
.rec{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:2px dotted rgba(74,44,29,.3)}
.rec .e{font-size:28px}.rec div{flex:1;line-height:1.2}.rec .m{font-size:18px}
.new{background:var(--sun);border-radius:8px;padding:0 6px;font-size:12px;font-weight:800;margin-left:4px}

#fx{position:fixed;inset:0;pointer-events:none;z-index:15}
.float{position:absolute;font-weight:800;font-size:20px;color:var(--sun);-webkit-text-stroke:1px var(--coffee);animation:up 1s ease-out forwards}
@keyframes up{to{transform:translateY(-50px);opacity:0}}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);background:var(--coffee);color:var(--paper);padding:6px 16px;border-radius:999px;font-weight:700;z-index:16;opacity:0;transition:opacity .2s;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
@media (max-height:640px){.face{font-size:34px}.slot{min-height:120px}.street{min-height:130px}.ing .e{font-size:24px}}

/* ===== v18: uniform compact layout ===== */
#app .hud{gap:6px;padding:8px 10px 4px}
#app .pill{border-width:2px;padding:1px 10px;font-size:14px;line-height:1.6;font-variant-numeric:tabular-nums}
#app .money{min-width:92px;text-align:center}
#app .stars{min-width:108px;text-align:center}
#app .day{border-width:2px;border-radius:12px;padding:3px 8px;min-width:92px}
#app .day b{font-size:13px}#app .day span{font-size:11px;font-variant-numeric:tabular-nums}
#app .iconbtn{width:34px;height:34px;border-width:2px;font-size:14px;box-shadow:0 2px 0 var(--coffee)}
#app .awning{height:18px;margin:4px 10px 0;border-width:2px}
#app .sign{font-size:16px;top:-3px;padding:0 12px}
#app .queue,#app .cater,#app .crew{margin:0 10px;border-width:2px}
#app .queue{min-height:30px;height:30px;padding:2px 8px}
#app .qp{font-size:18px}#app .qp i{width:20px;height:3px}
#app .cater{font-size:11.5px;padding:3px 8px}
#app .street{margin:0 10px;border-left-width:2px;border-right-width:2px;padding:6px 6px 4px;gap:6px;align-items:stretch}
#app .slot{height:100%;min-height:0;display:flex;align-items:flex-end;justify-content:center}
#app .cust{height:100%;max-height:215px;width:100%;max-width:none;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-end}
#app .bubble{flex:1 1 auto;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:center;border-width:2px;border-radius:12px;padding:3px 4px 4px}
#app .bubble::after{border-width:6px;bottom:-12px}
#app .bubble .who{flex:0 0 auto}
#app .face{flex:0 0 auto;font-size:30px;margin-top:8px;text-align:center}
#app .bar{flex:0 0 auto;width:70%;margin:3px auto 0;height:6px;border-width:1.5px}
#app .street.rows2 .face{font-size:22px;margin-top:6px}
#app .street.rows2 .cust{max-height:none}
#app .crew.has{padding:3px 5px;gap:3px}
#app .worker{flex:1 1 30%;padding:1px 5px;font-size:11px;border-width:1.5px;border-radius:8px}
#app .worker .f{font-size:16px}
#app .counter{margin:0 6px;padding:5px 6px;gap:6px;border-width:2px;border-radius:10px;box-shadow:0 3px 0 var(--coffee)}
#app .tray{min-height:40px;height:40px;overflow:hidden;border-width:2px;border-radius:10px;padding:2px 6px;flex-wrap:nowrap}
#app .tray .empty{font-size:12.5px}
#app .chip{font-size:22px}
#app .tray .res{font-size:12px;white-space:nowrap}
#app .trash{border-width:2px;border-radius:10px;padding:0 12px;height:40px;font-size:14px;box-shadow:0 2px 0 var(--coffee)}
#app .sttabs{margin:6px 10px 0;gap:5px;display:grid;grid-template-columns:repeat(3,1fr) 36px}
#app .sttabs button{border-width:2px;border-radius:9px;font-size:12.5px;padding:3px 2px;height:30px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#app .sttabs .bk{flex:none!important}
#app>.station{grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:6px;margin:5px 8px 8px;padding:10px 6px 6px;border-width:2px;border-radius:12px;max-height:84px}
#app .ing{height:62px;border-width:2px;border-radius:11px;box-shadow:0 3px 0 var(--coffee);padding:3px 2px 2px;justify-content:center;min-width:0}

function evalCombo(sel){

    GOOD.forEach(([x,y])=>{if((a.includes(x)&&b.includes(y))||(a.includes(y)&&b.includes(x)))good++});
    BAD.forEach(([x,y])=>{if((a.includes(x)&&b.includes(y))||(a.includes(y)&&b.includes(x)))bad++})}

function farmDay(){
  initFarm();const F=S.farm,log=[];let cost=0,rev=0,harv=0,roast=0,packed=0,sent=0,sold=0,trader=0;

  // farmers
  const pay=F.farmers.reduce((a,f)=>a+f.wage,0);S.money-=pay;cost+=pay;
  // harvest (needs at least one farmer)
  const eff=farmEff(),ev=Math.random()<.05?pick(['drought','frost','pests']):null,evReg=ev?pick(Object.keys(REGIONS)):null;
  if(ev)log.push(`${ev==='drought'?'☀️ Drought':ev==='frost'?'❄️ Frost':'🐛 Pests'} hit ${REGIONS[evReg].n}. Harvests there are smaller today.`);
  if(F.farmers.length)F.plots.forEach(p=>{if(!p.v)return;const st=plotStatus(p);if(!st.ready)return;const V=VARS[p.v];
    let kg=(1+.1*S.upg.irrig+.08*S.upg.fert)*V.yield*(REGIONS[p.r].best.includes(p.v)?1.25:.8)*(.4+.6*eff)*(.85+Math.random()*.3)*(p.r===evReg?(S.upg.agronomist?.75:.5):1);kg=Math.round(kg);

  else if(F.plots.some(p=>p.v&&plotStatus(p).ready))log.push('👨‍🌾 Cherries are ripe but you have no farmers to pick them');

  if(F.factory&&F.auto.roast){let capLeft=FACT[F.factory].cap;Object.keys(F.cherries).forEach(v=>{const use=Math.min(F.cherries[v],capLeft);if(use<=0)return;capLeft-=use;F.cherries[v]-=use;

    const brKg=R.br.reduce((a,b)=>a+(b.served||0),0)*.6/50;const gb=brKg?take('phin',brKg*50*.7)+take('espresso',brKg*50*.3):0;F.brCover=brKg?Math.min(1,gb/brKg):0;
  }

  if(F.pack&&F.auto.pack)Object.keys(F.roasted).forEach(v=>{const n=Math.floor(F.roasted[v]*2);if(n<=0)return;F.roasted[v]-=n/2;F.bags[v]=(F.bags[v]||0)+n;packed+=n;cost+=n*(S.upg.packfast?.2:.4)});

  const inStock=Object.keys(F.bags).filter(v=>F.bags[v]>0);
  if(inStock.length)Object.keys(CHANNELS).forEach(c=>{if(!F.ch[c])return;const C=CHANNELS[c];
    let dem=c==='shelf'?(R.served+R.br.reduce((a,b)=>a+(b.served||0),0))*.03:C.base;dem*=(1+S.buzz);

}

function spendable(){return S.money-S.reserve}
function runBoard(){
  const log=[];R.board=log;
  // Operations: open / expand branches
  if(boardOn('coo','open')){const nb=Object.values(LOC).filter(b=>!S.branches.includes(b.id)).sort((a,b)=>a.cost-b.cost)[0];
    const lp=S.hist.length?S.hist[S.hist.length-1].p:0;
    if(nb&&lp>0&&spendable()>nb.cost*1.5&&S.branches.every(id=>crewAt(id).length>0)){S.money-=nb.cost;S.branches.push(nb.id);log.push('👨‍💼 Opened a new branch in '+nb.n)}}
  if(boardOn('coo','expand')){const bs=S.branches.map(id=>({id,st:S.brStats[id]})).filter(x=>x.st&&x.st.lost>x.st.dem*.2&&crewAt(x.id).length>=cap(x.id)&&(S.brLvl[x.id]||0)<6);
    const x=bs[0];if(x){const lv=S.brLvl[x.id]||0,c=Math.round(LOC[x.id].cost*.6*(lv+1));if(spendable()>c){S.money-=c;S.brLvl[x.id]=lv+1;log.push('👨‍💼 Expanded '+LOC[x.id].n+' (was turning customers away)')}}}
  // HR: fill open spots, care, schedule
  if(boardOn('hr','hire')){
    // Work out how many people each location needs, neediest first
    const perStaff=10;
    const needs=['main',...S.branches].map(l=>{const have=crewAt(l).length,c=cap(l);let target=c;
      if(l!=='main'){const st=S.brStats[l];target=Math.min(c,Math.max(2,st?Math.ceil(st.dem/perStaff):2))}
      const turned=l==='main'?0:(S.brStats[l]?S.brStats[l].lost:0);
      return {l,want:Math.max(0,target-have),prio:(have===0?1000:0)+turned}}).filter(x=>x.want>0).sort((a,b)=>b.prio-a.prio);
    let hired=0,noCash=0;
    needs.forEach(n=>{for(let i=0;i<n.want;i++){
      const want=n.l==='main'?(()=>{const c=crewAt('main'),b=c.filter(x=>x.skills.bar).length,k=c.filter(x=>x.skills.kit).length;return b<=k?'bar':'kit'})():null;
      if(S.cands.length<3)S.cands=S.cands.concat(genCands());          // post a job ad for more applicants
      S.cands.sort((a,b)=>((want&&!a.skills[want]?1:0)-(want&&!b.skills[want]?1:0))||(bestSp(a)*a.wage-bestSp(b)*b.wage));
      const c=S.cands[0];if(spendable()<c.wage*3+30){noCash++;break}
      S.cands.shift();S.money-=30;S.staff.push({...c,loc:n.l,days:S.upg.academy?5:0,mo:70});hired++;
      log.push('👩‍💼 Hired '+c.face+' '+c.name+' for '+locName(n.l)+' ('+fmt(c.wage)+'/day)')}});
    if(hired)log.push('👩‍💼 Job ads and onboarding: -'+fmt(hired*30));
    if(noCash)log.push('👩‍💼 Wanted to hire more but spare cash is below your reserve. Lower the reserve or grow profit.');
  }
  if(boardOn('hr','care'))S.staff.filter(x=>x.mo<35).forEach(x=>{if(spendable()>25){S.money-=25;x.mo=Math.min(100,x.mo+15);log.push('👩‍💼 Gave '+x.name+' a $25 bonus to lift morale')}});
  if(boardOn('hr','sched')){const c=crewAt('main');let ch=0;c.forEach(x=>{const p=Object.keys(x.skills).length>1?'flex':Object.keys(x.skills)[0];if(x.pos!==p){x.pos=p;ch++}});if(ch)log.push('👩‍💼 Updated '+ch+' staff positions at Weymouth')}
  // Finance
  if(boardOn('cfo','loans'))S.loans.slice().forEach(l=>{const c=payoff(l);if(spendable()>c){S.money-=c;S.loans=S.loans.filter(y=>y!==l);log.push('🧑‍💼 Paid off a '+fmt(l.amt)+' loan early')}});
  if(boardOn('cfo','prices')&&R.balked>=3){let n=0;unlocked().forEach(r=>{if(pRatio(r)>1.15){S.prices[r.id]=Math.round((price(r)-.25)*4)/4;n++}});if(n)log.push('🧑‍💼 Lowered prices on '+n+' items after customers balked')}
  if(boardOn('cfo','buyback')&&S.ipo.sold>0){const v=valuation();if(spendable()>v*.105*2){S.money-=v*.105;S.ipo.sold=Math.max(0,Math.round((S.ipo.sold-.1)*100)/100);log.push('🧑‍💼 Bought back 10% of company shares')}}
  // Marketing
  if(boardOn('cmo','ads')){const want=S.comps.length?'google':S.buzz<.05?'rednote':null;if(want&&!campOn(want)){const k=CAMP.find(z=>z.id===want);if(spendable()>k.cost){S.money-=k.cost;S.camps.push({id:want,left:k.days,loc:null});log.push('👩‍🎤 Started '+k.n)}}}
  if(boardOn('cmo','cater')&&!S.catJob&&S.catOffers.length){const o=S.catOffers.shift();S.catJob=o;log.push('👩‍🎤 Booked catering for '+o.client+' today ('+fmt(o.pay)+')')}
  // Product
  if(boardOn('cpo','rd')){const avail=REC.filter(r=>r.d<=S.day&&hasReq(r)&&!S.known.includes(r.id)&&!S.rd.some(x=>x.id===r.id)).sort((a,b)=>rdCost(a)-rdCost(b));
    while(S.rd.length<1+S.upg.lab&&avail.length&&spendable()>rdCost(avail[0])){const r=avail.shift();S.money-=rdCost(r);S.rd.push({id:r.id,left:1});log.push('👨‍🍳 Started researching '+r.n)}}
}

// Target stock: last day's usage + 40% + 20 extra. Items not used last day keep a small buffer of 5.
function needFor(k){const u=S.lastUsed[k]||0;return u>0?Math.ceil(u*1.4)+20:5}
// Restock always keeps 30 extra on top of the need for anything used last day
function restockTo(k){const u=S.lastUsed[k]||0;return needFor(k)+(u>0?30:0)}
function restock(){S.spike=S.spikeNext;
  let spent=0,miss=0;
  ING_ORDER.filter(k=>needSet().has(k)).forEach(k=>{
    while((S.inv[k]||0)<restockTo(k)){const c=ingPrice(k);if(S.money<c){miss++;break}S.money-=c;spent+=c;S.spend+=c;S.inv[k]=(S.inv[k]||0)+ING[k].q}});
  save();sfx.coin();toast(miss?'Ran out of cash before restocking everything':'Restocked for '+fmt(spent));market();
}
const MGROUPS=[['bar','☕ Bar'],['top','🍓 Toppings'],['kit','🥖 Kitchen'],['world','🌏 Sourced from the Lab']];
const mgOf=k=>ING[k].world||(ING[k].src&&!['bar','top','kit'].includes(ING[k].st))?'world':ING[k].src?'world':ING[k].st;
function restockGroup(g){const need=needSet();let spent=0;ING_ORDER.filter(k=>need.has(k)&&mgOf(k)===g).forEach(k=>{while((S.inv[k]||0)<restockTo(k)){const c=ingPrice(k);if(S.money<c)break;S.money-=c;spent+=c;S.spend+=c;S.inv[k]=(S.inv[k]||0)+ING[k].q}});save();sfx.coin();toast('Restocked for '+fmt(spent));const sc=$('card').scrollTop;market();$('card').scrollTop=sc}
function market(){
  R=null;S.spike=S.spikeNext||null;hud();buildStation();
  const need=needSet(),keys=ING_ORDER.filter(k=>need.has(k));
  const cost=k=>{let h=S.inv[k]||0,e=0;while(h<restockTo(k)){h+=ING[k].q;e+=ingPrice(k)}return e};
  const est=keys.reduce((a,k)=>a+cost(k),0);
  const row=k=>{const g=ING[k],have=S.inv[k]||0,nd=needFor(k),low=have<nd;
    return `<div class="mrow"><span class="mic">${g.e}</span><div class="minfo"><b>${g.n}</b><small class="${low?'lowtxt':''}">📦 ${have} left · need ~${nd} · restock to ${restockTo(k)}</small><small>1 ${g.u} = ${g.q} servings${g.per&&!S.upg.tu&&!S.upg.smartfridge?' · <span class="tag">spoils overnight</span>':''}</small></div><div class="mbtns"><button class="mbuy" data-k="${k}" data-n="1" ${S.money<ingPrice(k)?'disabled':''}><b>${fmt(ingPrice(k))}</b><span>Buy</span></button><button class="mbulk" data-k="${k}" data-n="5" ${S.money<ingPrice(k)*4.25?'disabled':''}>×5 · ${fmt(ingPrice(k)*4.25)}</button></div></div>`};
  const groups=MGROUPS.map(([g,n])=>{const ks=keys.filter(k=>mgOf(k)===g);if(!ks.length)return '';
    const low=ks.filter(k=>(S.inv[k]||0)<needFor(k)).length,gc=ks.reduce((a,k)=>a+cost(k),0),key='mkt:'+g;
    return `<details class="srcgrp mgrp" data-key="${key}"${OPEN.has(key)?' open':''}><summary><span class="mgn">${n} <small>(${ks.length})</small></span>${low?`<span class="mlow">⚠️ ${low} low</span>`:'<span class="mok">✓ OK</span>'}</summary>
      ${gc?`<button class="flyall" onclick="restockGroup('${g}')">🛒 Restock ${n.replace(/^\S+\s/,'')} · ${fmt(gc)}</button>`:''}${ks.map(row).join('')}</details>`}).join('');
  const miss=unlocked().filter(r=>r.ing.some(k=>!(S.inv[k]>0))).map(r=>r.n);
  showModal(`<h2>Market</h2><p>Cash on hand: <b>${fmt(S.money)}</b><br>Today: ${wxLine(S.day,S.wx.t)}</p>${S.spikeNext?`<div class="warn">🚚 ${ING[S.spikeNext].n} costs 50% more today</div>`:''}
  <div class="mtop">${est?`<button class="big alt" onclick="restock()">🛒 Restock everything · ${fmt(est)}</button>`:'<p class="note" style="text-align:center">✓ Everything is stocked for a day like the last one.</p>'}
  <button class="big" onclick="startDay()">Open day ${S.day}</button></div>
  ${miss.length?`<div class="warn">Not enough ingredients for: ${miss.slice(0,6).join(', ')}${miss.length>6?' and '+(miss.length-6)+' more':''}</div>`:''}
  <p class="note">Restock tops up to last day's need (+40% +20) plus 30 extra. Tap a group to buy items one by one. ${S.upg.supplier?'📦 Your supplier contract also restocks when you open. ':''}Branches order their own ingredients.</p>
  ${groups}
  <button class="big alt" onclick="manage()">Manage shop</button>`);
  document.querySelectorAll('#card button[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k,g=ING[k],n=+b.dataset.n,c=n===5?ingPrice(k)*(S.upg.freezer&&PROTEINS.includes(k)?3.75:S.upg.shelving?4:4.25):ingPrice(k);
    if(S.money<c)return;S.money-=c;S.spend+=c;S.inv[k]=(S.inv[k]||0)+g.q*n;save();sfx.coin();
    const sc=$('card').scrollTop;market();$('card').scrollTop=sc});
}

let tt=0;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800)}
function floatAt(el,txt){const r=el.getBoundingClientRect(),f=document.createElement('div');f.className='float';f.textContent=txt;
  f.style.left=(r.left+r.width/2-30)+'px';f.style.top=(r.top+10)+'px';$('fx').appendChild(f);setTimeout(()=>f.remove(),1000)}

$('pauseBtn').onclick=pause;

$('trashBtn').onclick=()=>{if(R&&!R.paused&&R.tray.length){R.wasted+=R.tray.length;R.tray=[];renderTray()}};
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
function initLab(){
  S.lab=S.lab||{found:[],src:[],leads:[],tries:0,last:null,sel:[]};
  S.lab.custom=S.lab.custom||[];S.lab.off=S.lab.off||[];S.lab.team=S.lab.team||[];S.lab.rcands=S.lab.rcands||genResearchers();
  S.lab.found.forEach(id=>{const d=DISCO.find(x=>x.id===id);if(d&&!REC.some(r=>r.id===id))REC.push({...d,d:1,inv:1})});
  S.lab.custom.forEach(d=>{if(!REC.some(r=>r.id===d.id))REC.push({...d,d:1,inv:1})});
  if(!S.lab.leads.length&&!S.lab.found.length)S.lab.leads=['avosmoothie'];
}
initFin();initLab();initTax();initFarm();
intro();
