<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Saigonesee Café Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --tile:#1F6B5C; --tile2:#26806C; --stool:#E0442F; --sun:#F2B632;
  --coffee:#4A2C1D; --paper:#FFF8EC; --ink:#2B1A10; --wood:#8A5A3B;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --tile:#164D43; --tile2:#1B5C50; --paper:#F3E6CF; --wood:#6E4730; }
}
:root[data-theme="dark"]{ --tile:#164D43; --tile2:#1B5C50; --paper:#F3E6CF; --wood:#6E4730; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--tile)}
body{
  height:100%;margin:0;color:var(--ink);
  font-family:"Baloo 2",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background-color:var(--tile);
  background-image:
    radial-gradient(circle at 50% 50%, var(--sun) 0 7%, transparent 7.5%),
    radial-gradient(circle at 0 0, var(--paper) 0 9%, transparent 9.5%),
    radial-gradient(circle at 100% 0, var(--paper) 0 9%, transparent 9.5%),
    radial-gradient(circle at 0 100%, var(--paper) 0 9%, transparent 9.5%),
    radial-gradient(circle at 100% 100%, var(--paper) 0 9%, transparent 9.5%),
    conic-gradient(from 45deg, var(--tile2) 0 25%, var(--tile) 0 50%, var(--tile2) 0 75%, var(--tile) 0);
  background-size:72px 72px;
  -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;
  overflow:hidden;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;position:relative}

/* HUD */
.hud{display:flex;align-items:center;gap:8px;padding:10px 12px 6px}
.pill{background:var(--paper);border:3px solid var(--coffee);border-radius:999px;padding:2px 12px;font-weight:800;line-height:1.5;white-space:nowrap}
.day{display:flex;flex-direction:column;line-height:1.05;background:var(--stool);color:var(--paper);border:3px solid var(--coffee);border-radius:14px;padding:4px 10px}
.day b{font-size:15px}.day span{font-size:13px;font-weight:700;opacity:.9}
.money{font-size:18px}
.stars{font-size:15px;color:var(--coffee)}
.stars i{font-style:normal;color:var(--stool)}
.hud .sp{flex:1}
.iconbtn{width:42px;height:42px;border-radius:50%;background:var(--paper);border:3px solid var(--coffee);font-size:18px;font-weight:800;box-shadow:0 3px 0 var(--coffee)}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--coffee)}

/* awning */
.awning{margin:4px 12px 0;height:22px;border-radius:10px 10px 0 0;
  background:repeating-linear-gradient(90deg,var(--stool) 0 28px,var(--paper) 28px 56px);
  border:3px solid var(--coffee);border-bottom:none;position:relative}
.sign{position:absolute;left:50%;top:-4px;transform:translateX(-50%);background:var(--coffee);color:var(--sun);
  font-weight:800;font-size:20px;padding:0 16px;border-radius:10px;letter-spacing:.5px;line-height:1.4}

/* street */
.street{margin:0 12px;flex:1;min-height:170px;display:grid;gap:8px;padding:12px 8px 0;
  background:rgba(0,0,0,.18);border-left:3px solid var(--coffee);border-right:3px solid var(--coffee);align-items:end}
.slot{display:flex;justify-content:center;align-items:flex-end;min-height:150px}
.cust{border:none;background:none;padding:0;display:flex;flex-direction:column;align-items:center;width:100%;max-width:130px;animation:walkin .35s ease-out}
@keyframes walkin{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.cust.leave{animation:leave .5s ease-in forwards}
@keyframes leave{to{transform:translateY(30px);opacity:0}}
.bubble{background:var(--paper);border:3px solid var(--coffee);border-radius:14px;padding:4px 6px 5px;width:100%;position:relative;text-align:center}
.bubble::after{content:"";position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);border:7px solid transparent;border-top-color:var(--coffee)}
.bubble .it{font-size:26px;line-height:1.1}
.bubble .nm{font-size:12.5px;font-weight:800;line-height:1.15}
.bubble .mini{font-size:12px;letter-spacing:1px;margin-top:1px}
.face{font-size:44px;line-height:1;margin-top:10px}
.bar{width:74%;height:8px;border-radius:6px;background:rgba(0,0,0,.35);margin-top:4px;overflow:hidden;border:2px solid var(--coffee)}
.bar>div{height:100%;background:var(--sun);width:100%}
.bar>div.low{background:var(--stool)}
.cust.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.cust.match .bubble{background:var(--sun)}

/* counter */
.counter{margin:0 6px;background:var(--wood);border:3px solid var(--coffee);border-radius:12px;padding:8px;display:flex;gap:8px;align-items:center;box-shadow:0 5px 0 var(--coffee)}
.tray{flex:1;min-height:52px;background:var(--paper);border:3px dashed var(--coffee);border-radius:12px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:4px 8px}
.tray .empty{font-size:14px;font-weight:700;opacity:.6}
.chip{border:none;background:none;font-size:26px;padding:0 2px;line-height:1}
.tray .res{margin-left:auto;font-weight:800;font-size:14px;background:var(--sun);border-radius:8px;padding:0 8px}
.trash{background:var(--stool);color:var(--paper);border:3px solid var(--coffee);border-radius:12px;font-weight:800;padding:8px 12px;box-shadow:0 3px 0 var(--coffee)}
.trash:active{transform:translateY(2px);box-shadow:0 1px 0 var(--coffee)}

/* station */
.station{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px 12px 8px}
.ing{background:var(--paper);border:3px solid var(--coffee);border-radius:16px;box-shadow:0 4px 0 var(--coffee);padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center}
.ing .e{font-size:28px;line-height:1.1}
.ing .n{font-size:12.5px;font-weight:700;line-height:1.1}
.ing:active{transform:translateY(3px);box-shadow:0 1px 0 var(--coffee)}
.ing.on{background:var(--sun)}
.ing{position:relative}
.ing .cnt{position:absolute;top:-8px;right:-6px;background:var(--coffee);color:var(--paper);font-size:12px;font-weight:800;border-radius:999px;min-width:22px;padding:0 5px;line-height:20px}
.ing.low .cnt{background:var(--stool)}
.ing.out{opacity:.45}
.warn{background:#FCE3DD;border:2px solid var(--stool);border-radius:10px;padding:4px 8px;font-weight:700;font-size:14px;margin-top:8px}
.tag{font-size:11px;font-weight:800;color:var(--stool)}
.crew{display:none;gap:6px;margin:0 12px;padding:6px 8px;background:rgba(0,0,0,.25);border-left:3px solid var(--coffee);border-right:3px solid var(--coffee)}
.crew.has{display:flex}
.worker{flex:1;min-width:0;background:var(--paper);border:2px solid var(--coffee);border-radius:10px;padding:2px 6px;display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700;line-height:1.2}
.worker .f{font-size:22px}.worker .w{flex:1;min-width:0}
.worker .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.worker .b{height:6px;background:rgba(0,0,0,.15);border-radius:4px;overflow:hidden;margin-top:2px}
.worker .b div{height:100%;background:var(--tile);width:0}
.tabs{display:flex;gap:6px;margin:10px 0 6px;flex-wrap:wrap}
.tabs button{flex:1;border:3px solid var(--coffee);border-radius:10px;background:var(--paper);font-weight:800;padding:2px 6px;white-space:nowrap}
.tabs.sm button{font-size:13px;border-width:2px}
.tabs .on{background:var(--sun)}
.fc{font-size:28px}
.acts{display:flex;flex-direction:column;gap:4px;align-items:stretch}
.acts select{font:inherit;font-weight:700;font-size:13px;border:2px solid var(--coffee);border-radius:8px;background:var(--paper);color:var(--ink);padding:1px 2px}
.upg button.fire{background:var(--paper);font-size:13px}
.note{font-size:13px;opacity:.8}
.sttabs{margin:10px 12px 0}
.sttabs button{font-size:13.5px}
.station.dense{grid-template-columns:repeat(5,1fr);gap:6px}
.dense .ing{border-radius:12px;padding:4px 1px 3px}
.dense .ing .e{font-size:22px}
.dense .ing .n{font-size:10.5px}
.station{padding-top:10px}
#app>.station{flex:0 1 auto;max-height:92px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  margin:6px 8px 8px;padding:12px 6px 10px;background:rgba(0,0,0,.18);border:3px solid var(--coffee);border-radius:14px;scrollbar-width:thin}
#app>.station::-webkit-scrollbar{width:5px}#app>.station::-webkit-scrollbar-thumb{background:var(--paper);border-radius:4px}
.sttabs{flex:0 0 auto}
.sttabs .bk{flex:0 0 44px!important}
.street{min-height:0;overflow:hidden;padding-top:8px}
.crew.has{padding:4px 6px;gap:4px}
.worker{padding:1px 5px;font-size:11.5px}
.worker .f{font-size:18px}
.queue{display:none;margin:0 12px;padding:3px 8px;background:rgba(0,0,0,.35);border-left:3px solid var(--coffee);border-right:3px solid var(--coffee);align-items:center;gap:5px;min-height:34px;flex-wrap:nowrap;overflow:hidden}
.queue.has{display:flex}
.ql{font-size:12px;font-weight:800;color:var(--paper);white-space:nowrap;margin-right:2px}
.qp{display:flex;flex-direction:column;align-items:center;font-size:22px;line-height:1;animation:walkin .3s ease-out}
.qp i{display:block;width:24px;height:4px;background:rgba(0,0,0,.4);border-radius:3px;margin-top:2px;overflow:hidden}
.qp b{display:block;height:100%;width:100%;background:var(--sun)}
.qp.qreg i{outline:1px solid var(--sun)}
.counter{padding:6px 8px}
.tray{min-height:44px}
.trash{padding:6px 12px}
.sttabs{margin-top:8px}
.pr{display:flex;align-items:center;gap:4px}
.pr button{min-width:34px!important;padding:2px 0!important}
.pr b{min-width:54px;text-align:center}
.vi{font-size:12px;opacity:.7;font-weight:600}
.ic{width:1.15em;height:1.15em;display:inline-block;vertical-align:-.2em}
#card .tabs:not(.sm){display:grid;grid-template-columns:repeat(3,1fr)}
#card .tabs:not(.sm) button{font-size:13px;padding:2px 2px}
.cust.regular .bubble{border-color:var(--sun);box-shadow:0 0 0 2px var(--coffee)}
.rev{background:#fff;border:2px solid rgba(74,44,29,.25);border-radius:10px;padding:4px 8px;margin:4px 0;font-size:14px;line-height:1.35}
.rev b{color:var(--stool)}
.cater{display:none;margin:0 12px;padding:4px 8px;background:var(--sun);border:3px solid var(--coffee);border-top:none;text-align:left;font-size:12.5px;line-height:1.35;color:var(--ink)}
.cater.has{display:block}
.cater .ci{display:inline-block;background:var(--paper);border-radius:6px;padding:0 5px;margin:1px 2px 0 0;font-weight:800}
.cater .ci.ok{background:#BFE3C9}
.cust.deliv .bubble{border-style:dashed}
.cust.inf .bubble{border-color:#C13584;box-shadow:0 0 0 2px #F7B6D2}
.street.dark{filter:brightness(.45)}
.street.rows2{grid-auto-rows:1fr;gap:4px 6px;padding-top:4px}
.street.rows2 .slot{min-height:0}
.street.rows2 .face{font-size:24px;margin-top:6px}
.street.rows2 .bar{height:6px;margin-top:2px}
.street.rows2 .bubble{padding:2px 2px 3px;border-width:2px;border-radius:10px}
.street.rows2 .bubble::after{bottom:-8px;border-width:5px}
.street.rows2 .who{font-size:9.5px}
.street.rows2 .oi .it{font-size:15px;line-height:1}
.street.rows2 .oi .nm{font-size:9px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.street.rows2 .oi{display:flex;flex-direction:column;align-items:center;min-width:0}
.street.rows2 .oi .nm{max-width:100%}
.street.rows2 .oi .mini{display:none}
.street.rows2 .oi+.oi{margin-top:0;padding-top:1px}
.queue{flex-shrink:0}

.bubble .who{font-size:11px;font-weight:800;color:var(--tile);line-height:1.1;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oi{border-radius:8px;padding:1px 0}
.oi+.oi{border-top:2px dotted rgba(74,44,29,.3);margin-top:2px;padding-top:3px}
.oi.byc{background:#DDF0E9}
.oi.done{opacity:.4}
.oi .by{font-size:10.5px;font-weight:800;color:var(--tile);line-height:1.1}
.cust.two .it{font-size:20px}
.cust.two .nm{font-size:11px}
.cust.two .mini{font-size:10px;letter-spacing:0}
.cust.many .oi{text-align:center}
.cust.many .oi .it{font-size:16px;line-height:1}
.cust.many .oi .nm{font-size:9.5px;line-height:1.1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cust.many .oi .mini{display:none}
.cust.many .oi .by{font-size:9px}
.cust.many .oi+.oi{margin-top:1px;padding-top:2px}
.slot{min-width:0}
.cust{min-width:0}
.cust.many .face{font-size:30px;margin-top:8px}
.street.many .nm{font-size:10.5px}
.street.many .it{font-size:20px}
.street.many .mini{font-size:9.5px;letter-spacing:0}
.street.many .face{font-size:32px}
.street.many .bubble{padding:3px 3px 4px}
.worker{flex:1 1 30%}
.crew.has{flex-wrap:wrap}
.srow{flex-wrap:wrap}
.upg .arow,.upg .posb{flex:1 1 100%!important}
.arow{display:flex;flex-wrap:wrap;gap:4px;width:100%;padding-left:38px;margin-top:4px}
.arow button,.arow select{flex:1 1 30%;min-width:0!important;background:var(--paper)!important;font-size:12.5px;padding:2px 4px!important;border-width:2px!important;border:2px solid var(--coffee);border-radius:8px;font-weight:800;color:var(--ink);font-family:inherit}
.arow button:disabled{opacity:.4}
.posb{display:flex;gap:4px;width:100%;padding-left:38px}
.posb button{flex:1;min-width:0!important;background:var(--paper)!important;font-size:12.5px;padding:1px 2px!important;border-width:2px!important}
.posb button.on{background:var(--sun)!important}
.sched{width:100%;border-collapse:collapse;margin:6px 0 8px;font-size:13px;font-weight:700;table-layout:fixed}
.sched th{background:var(--coffee);color:var(--paper);padding:3px;font-size:12.5px}
.sched td{border:2px solid var(--coffee);padding:4px;vertical-align:top;line-height:1.35}
.foot{display:flex;justify-content:center;padding:0 12px 10px}
.book{background:var(--paper);border:3px solid var(--coffee);border-radius:999px;padding:4px 18px;font-weight:800;box-shadow:0 3px 0 var(--coffee)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(20,12,6,.55);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal.show{display:flex}
.card{background:var(--paper);border:4px solid var(--coffee);border-radius:22px;max-width:420px;width:100%;max-height:88%;overflow:auto;padding:18px 18px 16px;box-shadow:0 8px 0 var(--coffee)}
.card h2{margin:0 0 4px;font-size:28px;line-height:1.1;color:var(--stool)}
.card p{margin:6px 0;line-height:1.45}
.big{display:block;width:100%;margin-top:12px;background:var(--stool);color:var(--paper);border:3px solid var(--coffee);border-radius:14px;font-size:20px;font-weight:800;padding:8px;box-shadow:0 4px 0 var(--coffee)}
.big.alt{background:var(--paper);color:var(--ink)}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 var(--coffee)}
.stat{display:flex;justify-content:space-between;font-weight:700;padding:2px 0;border-bottom:2px dotted rgba(74,44,29,.3)}
.upg{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:2px dotted rgba(74,44,29,.3)}
.upg div{flex:1;line-height:1.2}.upg small{opacity:.75;font-weight:600}
.upg button{background:var(--sun);border:3px solid var(--coffee);border-radius:10px;font-weight:800;padding:2px 10px;min-width:70px}
.upg button:disabled{opacity:.4}
.rec{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:2px dotted rgba(74,44,29,.3)}
.rec .e{font-size:28px}.rec div{flex:1;line-height:1.2}.rec .m{font-size:18px}
.new{background:var(--sun);border-radius:8px;padding:0 6px;font-size:12px;font-weight:800;margin-left:4px}

#fx{position:fixed;inset:0;pointer-events:none;z-index:15}
.float{position:absolute;font-weight:800;font-size:20px;color:var(--sun);-webkit-text-stroke:1px var(--coffee);animation:up 1s ease-out forwards}
@keyframes up{to{transform:translateY(-50px);opacity:0}}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);background:var(--coffee);color:var(--paper);padding:6px 16px;border-radius:999px;font-weight:700;z-index:16;opacity:0;transition:opacity .2s;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
@media (max-height:640px){.face{font-size:34px}.slot{min-height:120px}.street{min-height:130px}.ing .e{font-size:24px}}

/* ===== v18: uniform compact layout ===== */
#app .hud{gap:6px;padding:8px 10px 4px}
#app .pill{border-width:2px;padding:1px 10px;font-size:14px;line-height:1.6;font-variant-numeric:tabular-nums}
#app .money{min-width:92px;text-align:center}
#app .stars{min-width:108px;text-align:center}
#app .day{border-width:2px;border-radius:12px;padding:3px 8px;min-width:92px}
#app .day b{font-size:13px}#app .day span{font-size:11px;font-variant-numeric:tabular-nums}
#app .iconbtn{width:34px;height:34px;border-width:2px;font-size:14px;box-shadow:0 2px 0 var(--coffee)}
#app .awning{height:18px;margin:4px 10px 0;border-width:2px}
#app .sign{font-size:16px;top:-3px;padding:0 12px}
#app .queue,#app .cater,#app .crew{margin:0 10px;border-width:2px}
#app .queue{min-height:30px;height:30px;padding:2px 8px}
#app .qp{font-size:18px}#app .qp i{width:20px;height:3px}
#app .cater{font-size:11.5px;padding:3px 8px}
#app .street{margin:0 10px;border-left-width:2px;border-right-width:2px;padding:6px 6px 4px;gap:6px;align-items:stretch}
#app .slot{height:100%;min-height:0;display:flex;align-items:flex-end;justify-content:center}
#app .cust{height:100%;max-height:215px;width:100%;max-width:none;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-end}
#app .bubble{flex:1 1 auto;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:center;border-width:2px;border-radius:12px;padding:3px 4px 4px}
#app .bubble::after{border-width:6px;bottom:-12px}
#app .bubble .who{flex:0 0 auto}
#app .face{flex:0 0 auto;font-size:30px;margin-top:8px;text-align:center}
#app .bar{flex:0 0 auto;width:70%;margin:3px auto 0;height:6px;border-width:1.5px}
#app .street.rows2 .face{font-size:22px;margin-top:6px}
#app .street.rows2 .cust{max-height:none}
#app .crew.has{padding:3px 5px;gap:3px}
#app .worker{flex:1 1 30%;padding:1px 5px;font-size:11px;border-width:1.5px;border-radius:8px}
#app .worker .f{font-size:16px}
#app .counter{margin:0 6px;padding:5px 6px;gap:6px;border-width:2px;border-radius:10px;box-shadow:0 3px 0 var(--coffee)}
#app .tray{min-height:40px;height:40px;overflow:hidden;border-width:2px;border-radius:10px;padding:2px 6px;flex-wrap:nowrap}
#app .tray .empty{font-size:12.5px}
#app .chip{font-size:22px}
#app .tray .res{font-size:12px;white-space:nowrap}
#app .trash{border-width:2px;border-radius:10px;padding:0 12px;height:40px;font-size:14px;box-shadow:0 2px 0 var(--coffee)}
#app .sttabs{margin:6px 10px 0;gap:5px;display:grid;grid-template-columns:repeat(3,1fr) 36px}
#app .sttabs button{border-width:2px;border-radius:9px;font-size:12.5px;padding:3px 2px;height:30px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#app .sttabs .bk{flex:none!important}
#app>.station{grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:6px;margin:5px 8px 8px;padding:10px 6px 6px;border-width:2px;border-radius:12px;max-height:84px}
#app .ing{height:62px;border-width:2px;border-radius:11px;box-shadow:0 3px 0 var(--coffee);padding:3px 2px 2px;justify-content:center;min-width:0}

function beep(f,dur=.12,type='triangle',vol=.08){
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(vol,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+dur);
    o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+dur)}catch(e){}
}

  for(let i=1;i<n;i++){
    const dup=Math.random()<.15?first:null;                      // e.g. two of the same coffee
    const want=Math.random()<.55?'drink':'food',pool=unlocked().filter(r=>r.k===want);
    recs.push(dup||(pool.length?pickRec(pool):pickRec()));
  }

  const face=reg?reg.face:FACES[Math.floor(Math.random()*FACES.length)];

function funEvent(){
  let pool=FUN;const cs=R.cust.filter(x=>x&&!x.del&&!x.inf&&!x.balk);
  if(!cs.length)pool=FUN.filter(f=>!f.cust);
  const f=pick(pool);let who='A customer';
  if(f.cust){const c=pick(cs);who=c.name;removeCust(c,'😜')}
  const amt=Math.round(f.a()*(1+Math.min(S.day,60)*.02));
  S.money+=amt;if(amt>0)R.earned+=amt;
  R.news.push(`${f.e} ${f.t(who)} ${amt>0?'+':'-'}${fmt(Math.abs(amt))}`);

}

function queueTick(dt){
  if(!R.queue.length){if($('queue').dataset.n!=='0'){$('queue').dataset.n='0';renderQueue()}return}
  let ch=false;
  R.queue.forEach(o=>{o.qleft=(o.qleft??o.qmax)-dt;if(o.qbar)o.qbar.style.width=Math.max(0,o.qleft/o.qmax*100)+'%'});
  R.queue.filter(o=>o.qleft<=0).forEach(o=>{R.lost++;rate(1.5);regMiss(o);ch=true});
  R.queue=R.queue.filter(o=>o.qleft>0);
  while(R.queue.length){const free=R.cust.findIndex(c=>!c);if(free<0)break;place(R.queue.shift(),free);ch=true}
  $('queue').dataset.n=R.queue.length;
  if(ch)renderQueue();
}

function afterServe(c,ratio){
  if(c.reg){c.reg.loyal=Math.min(5,c.reg.loyal+1);return}
  if(ratio>.5&&S.regs.length<14+5*S.upg.loyalty&&Math.random()<.12*(1+.5*S.upg.loyalty)&&!S.regs.some(g=>g.name===c.name)){
    S.regs.push({name:c.name,face:c.face,usual:c.items[0].rec.id,loyal:3});toast('⭐ '+c.name+' is now a regular!')}
}
function regMiss(c){if(!c.reg||c.regHit)return;c.regHit=1;c.reg.loyal--;
  if(c.reg.loyal<=0){S.regs=S.regs.filter(g=>g!==c.reg);S.buzz=Math.max(-.3,S.buzz-.05);R.news.push('💔 '+c.reg.name+' stopped coming');toast('💔 '+c.reg.name+' stopped coming')}}
function rate(s){S.rating=Math.max(1,Math.min(5,S.rating*.85+s*.15))}
function itemEarn(c,it,staff,q){
  const ratio=c.left/c.max,pr=pRatio(it.rec),pp=price(it.rec);
  if(q==='miss')return pp;
  const tip=(it.rec.mods?1.3:1)*pp*(staff?(.05+.1*ratio):(.08+.27*ratio))*(1+S.upg.quat*.1+S.upg.decor*.05)*Math.max(.1,Math.min(1.3,2-pr))*(c.reg?1.5:1);
  if(c.del)return APPS[c.del].pick?pp+tip*.4:pp*(1-APPS[c.del].cut);
  let t=tip;if(R.bigTip){t+=20;R.bigTip=0;toast('💵 A customer left a $20 tip!')}
  return pp+t;
}
function completeItem(c,it,staff,q){
  const earn=itemEarn(c,it,staff,q);if(q==='miss'){rate(2.3);R.missMod=(R.missMod||0)+1}else if(it.rec.mods&&!staff)R.gotMod=(R.gotMod||0)+1;it.done=true;it.by=null;it.el.classList.add('done');it.el.classList.remove('byc');it.byEl.textContent='✓';
  S.money+=earn;R.earned+=earn;R.items++;floatAt(it.el,'+'+fmt(earn));sfx.coin();
  if(c.items.every(x=>x.done)){
    const ratio=c.left/c.max,pr=c.items.reduce((a,x)=>a+pRatio(x.rec),0)/c.items.length;
    R.served++;rate(3+(staff?1.5:2)*ratio-Math.max(-.5,Math.min(2,(pr-1)*2.5)));
    removeCust(c,ratio>.5?'😋':'🙂');if(!c.del)afterServe(c,ratio);
    if(c.inf){S.buzz=Math.min(.5,S.buzz+.12);R.news.push('📸 @southshorefoodie posted a glowing video');toast('📸 The influencer loved it! Buzz is up')}
  }
  markMatches();hud();
}
function serve(c){
  if(!R||R.paused||!R.cust[c.slot]||R.cust[c.slot].id!==c.id)return;
  if(R.out>R.t){toast('⚡ Power is out. Hang tight');return}
  if(c.balk)return;
  const open=c.items.filter(it=>!it.done);
  if(open.length&&open.every(it=>it.by)){toast(open[0].by.s.name+' is already making this');return}
  if(!R.tray.length){toast('Tray is empty. Make the order first');return}
  const it=open.find(x=>!x.by&&same(x.rec.ing,R.tray));
  const it2=it?null:open.find(x=>!x.by&&x.rec.base&&same(x.rec.base,R.tray));
  if(it){completeItem(c,it,false);if(it.rec.mods)toast('😊 Just how they like it: '+it.rec.mods.join(', '))}
  else if(it2){completeItem(c,it2,false,'miss');sfx.bad();toast('😕 Not quite: they asked for '+it2.rec.mods.join(', ')+'. No tip')}
  else{
    sfx.bad();rate(1.5);R.wrong++;regMiss(c);c.left=Math.max(0,c.left-6);
    c.fEl.textContent='😠';setTimeout(()=>{if(R&&R.cust[c.slot]===c)c.fEl.textContent=c.face},700);
    c.el.classList.remove('shake');void c.el.offsetWidth;c.el.classList.add('shake');
    toast('Wrong order! They wanted '+open.filter(x=>!x.by).map(x=>x.rec.n).join(' + '));
  }
  R.tray=[];renderTray();hud();save();
}

const stOf=r=>r.k==='drink'?'bar':'kit';
const canDo=(w,r)=>{const st=stOf(r);return !!w.s.skills[st]&&(w.s.pos==='flex'||w.s.pos===st)};
function crewTick(dt){

      if(w.c.cater){if(!R.cat){w.c=null;w.it=null;w.bar.style.width='0';return}}

      w.t-=dt;w.bar.style.width=(100*(1-w.t/w.sp))+'%';
      if(w.t<=0){const c=w.c,it=w.it;w.c=null;w.it=null;w.cool=.3;w.bar.style.width='0';if(c.cater){it.got++;caterCheck()}else completeItem(c,it,true)}
    }else{
      w.cool-=dt;if(w.cool>0)return;
      let best=null;
      R.cust.filter(x=>x&&!x.balk).sort((a,b)=>a.left-b.left).some(c=>{const it=c.items.find(i=>!i.done&&!i.by&&canDo(w,i.rec)&&hasStock(i.rec.ing));if(it){best=[c,it];return true}});
      if(!best&&R.cat){const x=R.cat.items.find(i=>i.got+(i.wip||0)<i.qty&&canDo(w,REC.find(z=>z.id===i.rid))&&REC.find(z=>z.id===i.rid).ing.every(k=>S.inv[k]>0));
        if(x){const r=REC.find(z=>z.id===x.rid);r.ing.forEach(k=>{S.inv[k]--;R.used[k]=(R.used[k]||0)+1});x.wip=(x.wip||0)+1;
          const it={rec:r,get got(){return x.got},set got(v){x.got=v;x.wip--}};w.c={cater:1};w.it=it;w.sp=w.s.skills[stOf(r)]*spMul(w.s)*stMul(stOf(r))*recMul(r);w.t=w.sp;stock();return}}
      if(!best){w.cool=.4;return}
      const [c,it]=best;
      it.rec.ing.forEach(k=>{S.inv[k]--;R.used[k]=(R.used[k]||0)+1});it.by=w;w.c=c;w.it=it;w.sp=w.s.skills[stOf(it.rec)]*spMul(w.s)*stMul(stOf(it.rec))*recMul(it.rec)*(c.del&&S.upg.sealer?.8:1);w.t=w.sp;
      it.el.classList.add('byc');it.byEl.textContent=w.s.face+' '+w.s.name;stock();markMatches();
    }
  });
}
function makeReviews(good,n,loc){
  const ar=avgRatio(),out=[];
  for(let i=0;i<n;i++){
    let st=1+4*good-(ar>1.15?(ar-1)*3:0)+(ar<.9?.5:0)+(loc==='main'&&R.wrong>2?-.5:0)+(Math.random()-.5)*1.4;
    st=Math.max(1,Math.min(5,Math.round(st)));
    const pool=REVIEWS[st].slice();if(ar>1.2&&st<=3)pool.push(...REVIEWS.pricey);if(loc==='main'&&R.wrong&&st<=2)pool.push(...REVIEWS.wrong);if(ar<.9&&st>=4)pool.push(...REVIEWS.cheap);
    out.push({st,loc,who:revName(),txt:pick(pool).replace('{item}',pick(unlocked()).n)});
  }
  return out;
}
function branchDay(b){
  const crew=crewAt(b.id),lv=S.brLvl[b.id]||0;
  const base=30*(1+.02*Math.min(S.day,40));
  const appsOn=Object.keys(APPS).filter(a=>S.apps[a]&&S.apps[a].on).length;
  const dem=Math.round((1+.12*appsOn)*base*b.demand*(1+.15*lv)*demand(b.id)*(brRate(b.id)/5)*Math.pow(avgRatio(),-1.5)*(.85+Math.random()*.3));
  const capO=crew.reduce((a,x)=>a+(DAYLEN/(bestSp(x)*spMul(x)))*.9*(x.pos==='flex'?1.15:1),0)*(crew.some(x=>x.mgr)?1.2:1)*(1+.05*(S.upg.machine+S.upg.grill))*(1+.1*S.upg.hq);
  const capC=Math.floor(capO/1.6),served=Math.min(dem,capC),lost=dem-served;
  const ic=.3-.05*S.upg.ckit-.02*S.upg.farm,rev=served*1.6*avgPrice()*(1-.3*(.12*appsOn/(1+.12*appsOn))),ing=rev*ic,net=rev-ing-b.rent;
  const good=dem?served/dem:0;
  if(crew.length)S.brRate[b.id]=Math.max(1,Math.min(5,brRate(b.id)*.8+(1+4*good-Math.max(0,(avgRatio()-1)*2.5))*.2));
  const reviews=crew.length?makeReviews(good,1+(Math.random()<.4?1:0),b.id):[];
  reviews.forEach(v=>S.buzz=Math.max(-.3,Math.min(.5,S.buzz+(v.st-3)*.01)));
  return {dem,served,lost,cap:capC,rev,ing,rent:b.rent,net,idle:!crew.length,staff:crew.length,rating:brRate(b.id),reviews};
}

  R.special=S.day>=6?pick(unlocked()):null;

  S.spike=S.spikeNext||null;
  if(S.upg.supplier||boardOn('coo','stock')){let sp=0;ING_ORDER.filter(k=>needSet().has(k)).forEach(k=>{while((S.inv[k]||0)<needFor(k)){const c=ingPrice(k);if(S.money<c)break;S.money-=c;sp+=c;S.spend+=c;S.inv[k]=(S.inv[k]||0)+ING[k].q}});if(sp)setTimeout(()=>R&&toast('📦 Supplier restocked for '+fmt(sp)),6500)}
  R.ev=[];[['inspect',.15],['break',.15*Math.pow(.5,S.upg.maint)],['inf',.08],['out',S.upg.generator?0:.06],['tip',.12],['theft',S.upg.cams?0:.05],['fun',.55],['fun',.3]].forEach(([k,p])=>{if(Math.random()<p)R.ev.push({k,t:DAYLEN*(.1+Math.random()*.75)})});R.ev.sort((a,b)=>a.t-b.t);
  R.cat=S.catJob?{...S.catJob,items:S.catJob.items.map(i=>({...i,got:0,wip:0}))}:null;renderCater();
  const h=holiday(S.day);
  renderQueue();
  R.crew=crewAt('main').map(x=>({s:x,t:0,cool:1+Math.random(),c:null,it:null}));buildCrew();
  renderTray();hud();last=performance.now();cancelAnimationFrame(raf);

    const v=valuation(),hs=S.hist.slice(-14);

    body=`<p style="font-weight:800;margin-bottom:2px">Daily operating profit</p>${spark}
    <p class="note">Last day: ${fmt(hs.length?hs[hs.length-1].p:0)}. 7-day average: ${fmt(avgProfit())}.</p>`+
    `<p style="margin-top:12px;font-weight:800">📦 Catering requests</p>`+
    (S.catJob?`<div class="upg"><div><b>${S.catJob.client}</b> <small>booked for today</small><br><small>${S.catJob.items.map(x=>{const r=REC.find(z=>z.id===x.rid);return r.e+' '+r.n+' ×'+x.qty}).join(', ')}</small></div></div>`:'')+
    (S.catOffers.length?S.catOffers.map(o=>{const due=7*60+Math.floor(o.due/DAYLEN*480);return `<div class="upg"><div><b>${o.client}</b><br><small>${o.items.map(x=>{const r=REC.find(z=>z.id===x.rid);return r.e+' '+r.n+' ×'+x.qty}).join(', ')}</small><br><small>Due by ${Math.floor(due/60)}:${String(due%60).padStart(2,'0')}, pays ${fmt(o.pay)}</small></div><button ${S.catJob?'disabled':''} onclick="acceptCat(${o.id})">Accept</button></div>`}).join('')+'<p class="note">An accepted order runs during your next day. Make each item and tap the 📦 banner. Staff help when they are free. Missing the deadline costs rating.</p>':'<p class="note">No requests right now. They come in every few days.</p>')+
    `<p style="margin-top:12px;font-weight:800">🏦 Bank loans</p>`+
    S.loans.map((l,i)=>`<div class="upg"><div><b>${fmt(l.amt)} loan</b><br><small>${fmt(l.pay)}/day, ${l.left} days left</small></div><button ${S.money<payoff(l)?'disabled':''} onclick="payOff(${i})">Pay off ${fmt(payoff(l))}</button></div>`).join('')+
    LOANS.map((o,i)=>{const lock=o.req&&S.branches.length<o.req;return `<div class="upg"><div><b>Borrow ${fmt(o.amt)}</b><br><small>${(o.rate*100).toFixed(1)}% a day for ${o.days} days: ${fmt(o.amt*(1+o.rate*o.days)/o.days)}/day${lock?`. Needs ${o.req} branches`:''}</small></div><button ${lock||S.loans.length>=2?'disabled':''} onclick="takeLoan(${i})">Borrow</button></div>`}).join('')+
    `<p style="margin-top:12px;font-weight:800">📈 Company shares</p><p class="note">Company value: <b>${fmt(v)}</b>. Share price: <b>${fmt(v/100000)}</b>. You own <b>${Math.round((1-S.ipo.sold)*100)}%</b>.</p>`+
    (!S.ipo.sold?`<div class="upg"><div><b>Go public (IPO)</b><br><small>Sell 20% of the company for ${fmt(v*.2)}. Shareholders get half your share of daily profit and dislike falling profits. Needs a value of $25,000.</small></div><button ${v<25000?'disabled':''} onclick="ipo()">IPO</button></div>`:
     `<div class="upg"><div><b>Sell 10% more</b><br><small>Raise ${fmt(v*.095)}. You can sell up to 49%.</small></div><button ${S.ipo.sold>=.49?'disabled':''} onclick="shares(1)">Sell</button></div><div class="upg"><div><b>Buy back 10%</b><br><small>Costs ${fmt(v*.105)}</small></div><button ${S.money<v*.105?'disabled':''} onclick="shares(-1)">Buy</button></div>`)+
    `<button class="big alt" onclick="board('manage')">🏆 Leaderboard</button>`;
  }
  if(MT==='board'){
    const sal=Object.keys(S.board).filter(k=>S.board[k].on).reduce((a,k)=>a+EXECS[k].sal,0);

      const head=`<div class="exec"><div class="exh"><span class="exf">${e.e}</span><div><b>${e.n}</b><br><small>${e.d}. ${fmt(e.sal)}/day</small></div>`;

      if(!b.on)return head+`<button class="mbuy" ${S.money<e.fee/2?'disabled':''} onclick="rehireExec('${k}')"><b>${fmt(e.fee/2)}</b><span>Rehire</span></button></div></div>`;
      return head+`<button class="mbulk" onclick="fireExec('${k}')">Let go</button></div>${Object.entries(e.opts).map(([o,t])=>`<label class="exo"><input type="checkbox" ${b.opts[o]?'checked':''} onchange="toggleOpt('${k}','${o}')"><span>${t}</span></label>`).join('')}</div>`}).join('');
  }
  if(MT==='upg'||MT==='eq')body=(MT==='eq'?'<p class="note">Equipment works at every location. Some machines unlock new menu items in 🔬 R&D.</p>':'')+'<div id="upgs"></div>';
  showModal(`<h2>Manage shop</h2><p>Cash: <b>${fmt(S.money)}</b><br>Daily wages: <b>${fmt(totalWage())}</b></p>
  <div class="tabs">${tabs.map(([k,n])=>`<button class="${k===MT?'on':''}" onclick="manage('${k}')">${n}</button>`).join('')}</div>${body}
  <button class="big" onclick="preDay()">Go to market</button>`);
  if(MT==='upg'||MT==='eq')renderUpg();

const LOANS=[{amt:1000,rate:.01,days:15},{amt:5000,rate:.012,days:20},{amt:20000,rate:.015,days:30,req:3}];
const avgProfit=()=>{const h=S.hist.slice(-7);return h.length?h.reduce((a,x)=>a+x.p,0)/h.length:0};
function valuation(){return Math.round(Math.max(0,avgProfit())*30+2000+S.branches.reduce((a,id)=>a+LOC[id].cost*(1+.6*(S.brLvl[id]||0))*.5,0)+S.known.length*40)}
const payoff=l=>Math.round(l.amt*l.left/l.days);
function takeLoan(i){const o=LOANS[i];if(S.loans.length>=2)return;S.money+=o.amt;S.loans.push({amt:o.amt,days:o.days,left:o.days,pay:Math.round(o.amt*(1+o.rate*o.days)/o.days*100)/100});save();sfx.coin();toast('🏦 Borrowed '+fmt(o.amt));manage()}
function payOff(i){const l=S.loans[i],c=payoff(l);if(S.money<c)return;S.money-=c;S.loans.splice(i,1);save();toast('🏦 Loan paid off');manage()}
function ipo(){const v=valuation();if(v<25000||S.ipo.sold)return;S.money+=v*.2;S.ipo.sold=.2;save();sfx.coin();toast('🔔 Saigonesee is now a public company!');manage()}
function shares(d){const v=valuation();if(d>0){if(S.ipo.sold>=.49)return;S.money+=v*.095;S.ipo.sold=Math.min(.49,S.ipo.sold+.1)}else{if(S.money<v*.105)return;S.money-=v*.105;S.ipo.sold=Math.max(0,Math.round((S.ipo.sold-.1)*100)/100)}save();manage()}
function acceptCat(id){const o=S.catOffers.find(x=>x.id===id);if(!o||S.catJob)return;S.catJob=o;S.catOffers=S.catOffers.filter(x=>x!==o);save();toast('📦 Catering booked for today');manage()}
let LBP=null;
function takeName(){const el=$('pname0');const v=(el&&el.value||'').trim().slice(0,16);
  if(!v){el.classList.add('need');el.focus();toast('Please type your name first');return false}
  S.player=v;save();return true}
function companyScore(){return valuation()+Math.max(0,S.money)}
function saveScore(reason){
  if(!S.pid){S.pid=Math.random().toString(36).slice(2,10)+Date.now().toString(36);save()}
  const e={pid:S.pid,name:S.player||'Player',day:S.day,value:Math.round(companyScore()),branches:S.branches.length,at:Date.now(),why:reason||''};
  let hof=[];try{hof=JSON.parse(localStorage.getItem('saigonesee-hof')||'[]')}catch(x){}
  const k=hof.findIndex(x=>x.pid===e.pid&&x.run===S.run);
  if(k>=0){if(e.value>=hof[k].value)hof[k]={...e,run:S.run};else hof[k].name=e.name}else hof.push({...e,run:S.run});
  hof.sort((a,b)=>b.value-a.value);hof=hof.slice(0,10);try{localStorage.setItem('saigonesee-hof',JSON.stringify(hof))}catch(x){}
  if(LB_URL){try{LBP=fetch(LB_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(e)}).catch(()=>{})}catch(x){}}
  fbSave(e);S.lastPost=e.value;S.lastPostAt=Date.now();save();
  return hof;
}
// Auto-save to the leaderboard every 90 seconds of play and after each day
function autoPost(reason){if(!S.player)return;if(Date.now()-(S.lastPostAt||0)<60000&&reason!=='closed')return;if(Math.round(companyScore())===S.lastPost)return;saveScore(reason)}
setInterval(()=>{if(R&&!R.paused&&!document.hidden)autoPost('auto')},90000);
let BF='';
function board(from){
  if(from!==undefined)BF=from;
  if(R&&!R.paused)R.paused=true;
  let hof=[];try{hof=JSON.parse(localStorage.getItem('saigonesee-hof')||'[]')}catch(x){}
  const rows=l=>l.map((e,i)=>`<div class="stat"><span>${i+1}. ${String(e.name).replace(/[<>&]/g,'')} <small>day ${e.day}, ${e.branches} branches</small></span><b>${fmt(e.value)}</b></div>`).join('')||'<p class="note">No scores yet.</p>';
  const back=R?'resume()':BF==='intro'?'intro()':'manage()';
  showModal(`<h2>🏆 Leaderboard</h2><p class="note">Scores save automatically every couple of minutes while you play. Score = company value + cash. Your company right now: <b>${fmt(companyScore())}</b>.</p>
  <p><input id="pname" maxlength="16" placeholder="Your name" value="${(S.player||'').replace(/"/g,'')}" style="font:inherit;font-weight:700;padding:4px 8px;border:2px solid var(--coffee);border-radius:8px;width:60%"> <button class="fire" style="border:2px solid var(--coffee);border-radius:8px;font-weight:800;padding:4px 10px;background:var(--sun)" onclick="S.player=$('pname').value.trim()||'Player';save();saveScore('manual');board()">Save score</button></p>
  ${LB_URL||FIREBASE_CONFIG||/\.web\.app$|\.firebaseapp\.com$/.test(location.hostname)?'<p style="font-weight:800">🌎 Everyone</p><div id="lbOnline"><p class="note">Loading…</p></div>':''}
  <p style="font-weight:800">On this device</p>${rows(hof)}
  <button class="big" onclick="${back}">Back</button>`);
  if(FIREBASE_CONFIG||/\.web\.app$|\.firebaseapp\.com$/.test(location.hostname))fbTop().then(l=>{const el=$('lbOnline');if(el)el.innerHTML=l?rows(l):'<p class="note">Could not load the online leaderboard.</p>'}).catch(()=>{const el=$('lbOnline');if(el)el.innerHTML='<p class="note">Could not load the online leaderboard.</p>'});
  else if(LB_URL)(LBP||Promise.resolve()).then(()=>fetch(LB_URL+'?t='+Date.now())).then(r=>r.json()).then(l=>{const el=$('lbOnline');if(el)el.innerHTML=rows(l.slice(0,20))}).catch(()=>{const el=$('lbOnline');if(el)el.innerHTML='<p class="note">Could not load the online leaderboard.</p>'});
}
function toggleApp(a){const s0=S.apps[a];if(!s0){if(S.money<APPS[a].fee)return;S.money-=APPS[a].fee;S.apps[a]={on:true}}else s0.on=!s0.on;save();manage()}
function research(id){const r=REC.find(x=>x.id===id);if(S.money<rdCost(r)||S.rd.length>=1+S.upg.lab)return;
  S.money-=rdCost(r);S.rd.push({id,left:1});save();sfx.coin();toast('Researching '+r.n);manage()}
function expandBr(id){const b=LOC[id],lv=S.brLvl[id]||0,c=Math.round(b.cost*.6*(lv+1));if(S.money<c||lv>=6)return;S.money-=c;S.brLvl[id]=lv+1;save();sfx.coin();toast(b.n+' expanded: more staff room and traffic');manage()}
function runCamp(id,l){const k=CAMP.find(z=>z.id===id);if(S.money<k.cost||campOn(id,k.local?l:null))return;
  S.money-=k.cost;S.camps.push({id,left:k.days,loc:k.local?l:null});if(k.buzz)S.buzz=Math.min(.5,S.buzz+k.buzz);save();sfx.coin();toast(k.n+' is running');manage()}
function raise(id){const x=S.staff.find(y=>y.id===id);x.wage=Math.round(x.wage*1.1);x.mo=Math.min(100,x.mo+25);save();toast(x.name+' got a raise');manage()}
function bonus(id){const x=S.staff.find(y=>y.id===id);if(S.money<25)return;S.money-=25;x.mo=Math.min(100,x.mo+15);save();toast(x.name+' got a $25 bonus');manage()}
function promote(id){const x=S.staff.find(y=>y.id===id);crewAt(x.loc).forEach(y=>y.mgr=false);x.mgr=true;x.wage+=15;x.mo=Math.min(100,x.mo+20);save();toast(x.name+' is now manager of '+locName(x.loc));manage()}
function setPrice(id,d){const r=REC.find(x=>x.id===id);
  let v=Math.round((price(r)+d)*4)/4;v=Math.max(Math.round(r.p*2)/4,Math.min(r.p*2,v));
  if(Math.abs(v-r.p)<.001)delete S.prices[id];else S.prices[id]=v;save();manage()}
function posBtns(x){
  return `<div class="posb">${Object.keys(POS).map(p=>`<button class="${x.pos===p?'on':''}" ${canPos(x,p)?'':'disabled'} onclick="setPos(${x.id},'${p}')">${POS[p].e} ${POS[p].n}</button>`).join('')}</div>`;
}
function staffRow(x){
  const opts=['main',...S.branches].map(l=>`<option value="${l}" ${l===x.loc?'selected':''}>${locName(l)}</option>`).join('');
  return `<div class="upg srow"><span class="fc">${x.face}</span><div><b>${x.name}${x.mgr?' 👑':''}</b> <small>Lv ${lvl(x)}</small><br><small>${skillText(x)}</small><br><small>${fmt(x.wage)}/day, morale ${moFace(x.mo)} ${Math.round(x.mo)}</small></div>
  <div class="arow"><button onclick="raise(${x.id})">Raise +${fmt(Math.round(x.wage*.1))}</button><button ${S.money<25?'disabled':''} onclick="bonus(${x.id})">Bonus $25</button>${x.loc!=='main'&&!x.mgr?`<button onclick="promote(${x.id})">Make manager</button>`:''}${S.branches.length?`<select aria-label="Location" onchange="moveStaff(${x.id},this.value)">${opts}</select>`:''}<button onclick="fire(${x.id})">Let go</button></div>${x.loc==='main'?posBtns(x):''}</div>`;
}
function schedTable(crew){
  if(!crew.length||ML!=='main')return '';
  const col=p=>crew.filter(x=>x.pos===p).map(x=>x.face+' '+x.name).join('<br>')||'<span style="opacity:.4">—</span>';
  return `<table class="sched"><tr>${Object.keys(POS).map(p=>`<th>${POS[p].e} ${POS[p].n}</th>`).join('')}</tr><tr>${Object.keys(POS).map(p=>`<td>${col(p)}</td>`).join('')}</tr></table>`;
}
function setPos(id,p,live){const x=S.staff.find(y=>y.id===id);if(!x||!canPos(x,p))return;x.pos=p;save();live?schedLive():manage()}
function schedLive(){
  const crew=crewAt('main');
  showModal(`<h2>Today's schedule</h2><p class="note">Flex staff jump between Bar and Kitchen, whichever has the next order waiting.</p>${schedTable(crew)}${crew.map(x=>`<div class="upg" style="flex-wrap:wrap"><span class="fc">${x.face}</span><div><b>${x.name}</b><br><small>${skillText(x)}</small></div>${posBtns(x).replace(/setPos\((\d+),'(\w+)'\)/g,"setPos($1,'$2',1)")}</div>`).join('')||'<p class="note">No staff at Weymouth yet. Hire in Manage shop after closing.</p>'}<button class="big" onclick="resume()">Resume</button>`);
}
function spendable(){return S.money-S.reserve}
function runBoard(){
  const log=[];R.board=log;
  // Operations: open / expand branches
  if(boardOn('coo','open')){const nb=Object.values(LOC).filter(b=>!S.branches.includes(b.id)).sort((a,b)=>a.cost-b.cost)[0];
    const lp=S.hist.length?S.hist[S.hist.length-1].p:0;
    if(nb&&lp>0&&spendable()>nb.cost*1.5&&S.branches.every(id=>crewAt(id).length>0)){S.money-=nb.cost;S.branches.push(nb.id);log.push('👨‍💼 Opened a new branch in '+nb.n)}}
  if(boardOn('coo','expand')){const bs=S.branches.map(id=>({id,st:S.brStats[id]})).filter(x=>x.st&&x.st.lost>x.st.dem*.2&&crewAt(x.id).length>=cap(x.id)&&(S.brLvl[x.id]||0)<6);
    const x=bs[0];if(x){const lv=S.brLvl[x.id]||0,c=Math.round(LOC[x.id].cost*.6*(lv+1));if(spendable()>c){S.money-=c;S.brLvl[x.id]=lv+1;log.push('👨‍💼 Expanded '+LOC[x.id].n+' (was turning customers away)')}}}
  // HR: fill open spots, care, schedule
  if(boardOn('hr','hire')){const locs=['main',...S.branches];
    locs.forEach(l=>{while(crewAt(l).length<cap(l)&&S.cands.length&&spendable()>totalWage()*2){
      const want=l==='main'?(()=>{const c=crewAt('main'),b=c.filter(x=>x.skills.bar).length,k=c.filter(x=>x.skills.kit).length;return b<=k?'bar':'kit'})():null;
      S.cands.sort((a,b)=>((want&&!a.skills[want]?1:0)-(want&&!b.skills[want]?1:0))||(bestSp(a)*a.wage-bestSp(b)*b.wage));
      const c=S.cands.shift();S.staff.push({...c,loc:l,days:0,mo:70});log.push('👩‍💼 Hired '+c.face+' '+c.name+' for '+locName(l)+' ('+fmt(c.wage)+'/day)')}});}
  if(boardOn('hr','care'))S.staff.filter(x=>x.mo<35).forEach(x=>{if(spendable()>25){S.money-=25;x.mo=Math.min(100,x.mo+15);log.push('👩‍💼 Gave '+x.name+' a $25 bonus to lift morale')}});
  if(boardOn('hr','sched')){const c=crewAt('main');let ch=0;c.forEach(x=>{const p=Object.keys(x.skills).length>1?'flex':Object.keys(x.skills)[0];if(x.pos!==p){x.pos=p;ch++}});if(ch)log.push('👩‍💼 Updated '+ch+' staff positions at Weymouth')}
  // Finance
  if(boardOn('cfo','loans'))S.loans.slice().forEach(l=>{const c=payoff(l);if(spendable()>c){S.money-=c;S.loans=S.loans.filter(y=>y!==l);log.push('🧑‍💼 Paid off a '+fmt(l.amt)+' loan early')}});
  if(boardOn('cfo','prices')&&R.balked>=3){let n=0;unlocked().forEach(r=>{if(pRatio(r)>1.15){S.prices[r.id]=Math.round((price(r)-.25)*4)/4;n++}});if(n)log.push('🧑‍💼 Lowered prices on '+n+' items after customers balked')}
  if(boardOn('cfo','buyback')&&S.ipo.sold>0){const v=valuation();if(spendable()>v*.105*2){S.money-=v*.105;S.ipo.sold=Math.max(0,Math.round((S.ipo.sold-.1)*100)/100);log.push('🧑‍💼 Bought back 10% of company shares')}}
  // Marketing
  if(boardOn('cmo','ads')){const want=S.comps.length?'google':S.buzz<.05?'rednote':null;if(want&&!campOn(want)){const k=CAMP.find(z=>z.id===want);if(spendable()>k.cost){S.money-=k.cost;S.camps.push({id:want,left:k.days,loc:null});log.push('👩‍🎤 Started '+k.n)}}}
  if(boardOn('cmo','cater')&&!S.catJob&&S.catOffers.length){const o=S.catOffers.shift();S.catJob=o;log.push('👩‍🎤 Booked catering for '+o.client+' today ('+fmt(o.pay)+')')}
  // Product
  if(boardOn('cpo','rd')){const avail=REC.filter(r=>r.d<=S.day&&hasReq(r)&&!S.known.includes(r.id)&&!S.rd.some(x=>x.id===r.id)).sort((a,b)=>rdCost(a)-rdCost(b));
    while(S.rd.length<1+S.upg.lab&&avail.length&&spendable()>rdCost(avail[0])){const r=avail.shift();S.money-=rdCost(r);S.rd.push({id:r.id,left:1});log.push('👨‍🍳 Started researching '+r.n)}}
}
function hireExec(k){const e=EXECS[k];if(S.money<e.fee)return;S.money-=e.fee;S.board[k]={on:true,opts:Object.fromEntries(Object.keys(e.opts).map(o=>[o,1]))};save();sfx.coin();toast(e.e+' '+e.n+' joined the board');if(k==='hr')S.cands=S.cands.concat(genCands().slice(0,3));manage()}
function fireExec(k){S.board[k].on=false;save();toast(EXECS[k].n+' left the board');manage()}
function rehireExec(k){const e=EXECS[k];if(S.money<e.fee/2)return;S.money-=e.fee/2;S.board[k].on=true;save();manage()}
function toggleOpt(k,o){const b=S.board[k];b.opts[o]=b.opts[o]?0:1;save();manage()}
function hire(i){const c=S.cands[i];if(!c||crewAt(ML).length>=cap(ML))return;
  S.staff.push({...c,loc:ML,days:0,mo:70});S.cands.splice(i,1);save();sfx.coin();toast('Hired '+c.name+' for '+locName(ML));manage()}
function fire(id){const x=S.staff.find(y=>y.id===id);S.staff=S.staff.filter(y=>y.id!==id);save();toast(x.name+' was let go');manage()}
function moveStaff(id,l){const x=S.staff.find(y=>y.id===id);
  if(crewAt(l).length>=cap(l)){toast(locName(l)+' is fully staffed');manage();return}
  x.loc=l;x.mgr=false;save();toast('Moved '+x.name+' to '+locName(l));manage()}
function openBr(id){const b=LOC[id];if(S.money<b.cost)return;S.money-=b.cost;S.branches.push(id);save();sfx.coin();
  ML=id;toast('Opened '+b.n+'. Hire staff for it next');manage('staff')}
function cost(u){return Math.round(u.base*Math.pow(1.6,S.upg[u.id]||0))}
function renderUpg(){
  const box=$('upgs');if(!box)return;box.innerHTML='';const eqTab=MT==='eq';
  UPG.filter(u=>!!u.eq===eqTab).forEach(u=>{
    if(u.g){const h=document.createElement('p');h.style.cssText='font-weight:800;margin:12px 0 0';h.textContent=u.g;box.appendChild(h);return}
    const lv=S.upg[u.id]||0,maxed=lv>=u.max,c=cost(u);
    const row=document.createElement('div');row.className='upg';
    row.innerHTML=`<div><b>${u.n}</b> <small>${lv}/${u.max}</small><br><small>${u.d}</small></div>`;
    const b=document.createElement('button');b.textContent=maxed?'Maxed':fmt(c);b.disabled=maxed||S.money<c;
    b.onclick=()=>{if(S.money<c)return;S.money-=c;S.upg[u.id]=lv+1;save();sfx.coin();renderUpg();hud()};
    row.appendChild(b);box.appendChild(row)});
}
function preDay(){
  if(S.known.length>=REC.length&&!S.allDone){S.allDone=1;save();showModal(`<h2>Full menu unlocked!</h2><p>All ${REC.length} items on the Saigonesee menu are researched.</p><p>From here the game goes on forever. Once you're past day 15, each day gets a little busier and customers get a little less patient. Every 7th day is a weekend with three train rushes. How far can you go?</p><button class="big" onclick="market()">Go to market</button>`);return}
  market();
}
function needFor(k){const u=S.lastUsed[k]||0;return Math.ceil((u||4)*1.25)}
function restock(){S.spike=S.spikeNext;
  let spent=0,miss=0;
  ING_ORDER.filter(k=>needSet().has(k)).forEach(k=>{
    while((S.inv[k]||0)<needFor(k)){const c=ingPrice(k);if(S.money<c){miss++;break}S.money-=c;spent+=c;S.spend+=c;S.inv[k]=(S.inv[k]||0)+ING[k].q}});
  save();sfx.coin();toast(miss?'Ran out of cash before restocking everything':'Restocked for '+fmt(spent));market();
}
function market(){
  R=null;S.spike=S.spikeNext||null;hud();buildStation();
  const need=needSet();
  let est=0;ING_ORDER.filter(k=>need.has(k)).forEach(k=>{let h=S.inv[k]||0;while(h<needFor(k)){h+=ING[k].q;est+=ingPrice(k)}});
  const rows=ING_ORDER.filter(k=>need.has(k)).map(k=>{const g=ING[k],have=S.inv[k]||0,nd=needFor(k),low=have<nd;
    return `<div class="mrow"><span class="mic">${g.e}</span><div class="minfo"><b>${g.n}</b><small class="${low?'lowtxt':''}">📦 ${have} left · need about ${nd}</small><small>1 ${g.u} = ${g.q} servings${g.per&&!S.upg.tu?' · <span class="tag">spoils overnight</span>':''}</small></div><div class="mbtns"><button class="mbuy" data-k="${k}" data-n="1" ${S.money<ingPrice(k)?'disabled':''}><b>${fmt(ingPrice(k))}</b><span>Buy</span></button><button class="mbulk" data-k="${k}" data-n="5" ${S.money<ingPrice(k)*4.25?'disabled':''}>×5 · ${fmt(ingPrice(k)*4.25)}</button></div></div>`}).join('');
  const miss=unlocked().filter(r=>r.ing.some(k=>!(S.inv[k]>0))).map(r=>r.n);
  showModal(`<h2>Market</h2><p>Cash on hand: <b>${fmt(S.money)}</b><br>Today: ${wxLine(S.day,S.wx.t)}</p>${S.spikeNext?`<div class="warn">🚚 ${ING[S.spikeNext].n} costs 50% more today</div>`:''}${S.upg.supplier?'<p class="note">📦 Your supplier contract restocks Weymouth automatically when you open.</p>':''}<p class="note">This is for Weymouth. Branches order their own ingredients, and the cost shows in their daily report. Buy ×5 in bulk to save 15%.</p>
  ${est?`<button class="big alt" onclick="restock()">🛒 Restock to last day's usage (${fmt(est)})</button>`:'<p class="note">✓ Stocked for a day like the last one.</p>'}
  ${rows}
  ${miss.length?`<div class="warn">Not enough ingredients for: ${miss.join(', ')}</div>`:''}
  <button class="big" onclick="startDay()">Open day ${S.day}</button>
  <button class="big alt" onclick="manage()">Manage shop</button>`);
  document.querySelectorAll('#card button[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k,g=ING[k],n=+b.dataset.n,c=n===5?ingPrice(k)*(S.upg.freezer&&PROTEINS.includes(k)?3.75:4.25):ingPrice(k);
    if(S.money<c)return;S.money-=c;S.spend+=c;S.inv[k]=(S.inv[k]||0)+g.q*n;save();sfx.coin();
    const sc=$('card').scrollTop;market();$('card').scrollTop=sc});
}
/* modals */
function showModal(html){$('card').innerHTML=html;$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show')}
function recRow(r){return `<div class="rec"><span class="e">${r.e}</span><div><b>${r.n}</b>${r.vi?` <span class="vi">${r.vi}</span>`:''}${S.newIds.includes(r.id)?'<span class="new">new</span>':''}<br><span class="m">${r.ing.map(k=>ING[k].e).join(' ')}</span>${r.ing.includes('pate')&&r.ing.includes('butter')?'<br><small>Comes with pâté and butter. Some customers ask for no pâté or no butter.</small>':''}</div><b>${fmt(price(r))}</b></div>`}
function pause(){
  if(!R||R.paused)return;R.paused=true;
  showModal(`<h2>Paused</h2><p>${S.player?'👤 '+String(S.player).replace(/[<>&]/g,'')+'<br>':''}Day ${S.day}, ${fmt(S.money)}</p><button class="big" onclick="resume()">Resume</button><button class="big alt" onclick="schedLive()">📅 Schedule</button><button class="big alt" onclick="book(true)">📖 Recipes</button><button class="big alt" onclick="board('pause')">🏆 Leaderboard</button><button class="big alt" onclick="confirmReset()">Start over</button>`);
}
function resume(){closeModal();if(R){R.paused=false;last=performance.now()}}
function book(fromPause){
  if(R&&!R.paused)R.paused=true;
  showModal(`<h2>Recipes</h2><p>Pick every ingredient. Order doesn't matter.</p>${unlocked().map(recRow).join('')}<button class="big" onclick="${R?'resume()':'closeModal()'}">${R?'Back to work':'Close'}</button>`);
}
function confirmReset(){
  showModal(`<h2>Start over?</h2><p>Cash, days, staff, branches and upgrades all reset.</p><button class="big" onclick="doReset()">Start over</button><button class="big alt" onclick="${R?'pause2()':'intro()'}">Cancel</button>`);
}
function pause2(){R.paused=false;pause()}
function doReset(){const pn=S.player,pid=S.pid,run=(S.run||1)+1;S=fresh();S.player=pn;S.pid=pid;S.run=run;save();R=null;intro()}
function intro(){
  hud();buildStreet();buildStation();renderTray();
  const cont=S.day>1;
  showModal(`<div class="title"><div class="tsign"><span>SAIGONESEE</span><small>Cà Phê · Bánh Mì</small></div><div class="tlan"><svg class=\"nonla\" viewBox=\"0 0 40 22\" aria-hidden=\"true\"><path d=\"M2 18L20 3l18 15c-6 3-30 3-36 0z\" fill=\"#E6CF94\" stroke=\"#8A6A34\" stroke-width=\"1.2\" stroke-linejoin=\"round\"/><path d=\"M20 3L9 17.5M20 3l-5 15.8M20 3v16.2M20 3l5 15.8M20 3l11 14.5\" stroke=\"#C4A661\" stroke-width=\".8\"/><path d=\"M4 19.5c8 2 24 2 32 0\" stroke=\"#8A6A34\" stroke-width=\"1\" fill=\"none\"/></svg><svg class=\"phinic\" viewBox=\"0 0 24 26\" aria-hidden=\"true\"><rect x=\"5\" y=\"2\" width=\"14\" height=\"4\" rx=\"1\" fill=\"#C9CED6\" stroke=\"#3A2414\" stroke-width=\"1\"/><path d=\"M4 6h16l-1 7H5z\" fill=\"#AEB6BC\" stroke=\"#3A2414\" stroke-width=\"1\"/><rect x=\"1\" y=\"12\" width=\"22\" height=\"2.5\" rx=\"1\" fill=\"#C9CED6\" stroke=\"#3A2414\" stroke-width=\"1\"/><path d=\"M6 15h12l-1.5 10h-9z\" fill=\"#FFFDF5\" stroke=\"#3A2414\" stroke-width=\"1\"/><path d=\"M6.6 19h10.8l-.9 6h-9z\" fill=\"#6B3F24\"/><path d=\"M6.4 17h11.2l-.3 2H6.7z\" fill=\"#F4ECD8\"/></svg><svg class=\"nonla\" viewBox=\"0 0 40 22\" aria-hidden=\"true\"><path d=\"M2 18L20 3l18 15c-6 3-30 3-36 0z\" fill=\"#E6CF94\" stroke=\"#8A6A34\" stroke-width=\"1.2\" stroke-linejoin=\"round\"/><path d=\"M20 3L9 17.5M20 3l-5 15.8M20 3v16.2M20 3l5 15.8M20 3l11 14.5\" stroke=\"#C4A661\" stroke-width=\".8\"/><path d=\"M4 19.5c8 2 24 2 32 0\" stroke=\"#8A6A34\" stroke-width=\"1\" fill=\"none\"/></svg></div><p class="tline">Run your own Vietnamese café in South Weymouth. Brew phin coffee, build bánh mì, grow into a chain across Boston.</p></div><details class="how"><summary>How to play</summary>
  <p>Open 7am to 3pm. Customers order from the real Saigonesee menu: phin coffee, matcha, bánh mì, spring rolls and vermicelli bowls.</p>
  <p>Tap ingredients to make an order, then tap the customer to serve it. Fast service earns bigger tips. Slow service costs you stars.</p>
  <p>Switch between the Bar and Kitchen to find ingredients. Stock up at the market before each day. Baguettes, milk, greens and foams spoil overnight.</p>
  <p>Some staff can flex between Bar and Kitchen. Set everyone's position in the schedule. After closing, set your prices, hire staff, pay wages and open new branches.</p>
  <p>When the counter is full, customers can wait in line if you've built a waiting line. Customers have preferences like extra sweet, no sugar, no ice, extra ice, strong coffee or spicy bánh mì: tap an ingredient twice for extra, leave it out for none, and nail it for a bigger tip. Customers can order up to 4 items, like 2 drinks and a bánh mì. Serve each item, and they leave when the whole order is done.</p>
  <p>Research new menu items in 🔬 R&D, run marketing, beat competitors and turn customers into regulars. The game has no day limit.</p>
  <p>Buy equipment like an espresso machine or deep fryer to unlock more menu items. Turn on delivery apps and online pickup for extra orders.</p>
  <p>Watch the weather and holidays, take catering orders, borrow from the bank or take your company public, and climb the 🏆 leaderboard.</p>
  <p>When the Kingston train pulls in, expect a rush.</p>
  </details>
  <label class="nmlab" for="pname0">Your name</label>
  <input id="pname0" class="nmin" maxlength="16" autocomplete="nickname" placeholder="Type your name" value="${(S.player||'').replace(/"/g,'')}">
  <button class="big" onclick="if(!takeName())return;${cont?'preDay()':'market()'}">${cont?'Continue day '+S.day:'Start'}</button>
  <button class="big alt" onclick="board('intro')">🏆 Leaderboard</button>
  ${cont?'<button class="big alt" onclick="confirmReset()">Start over</button>':''}`);
}

/* fx */
let tt=0;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800)}
function floatAt(el,txt){const r=el.getBoundingClientRect(),f=document.createElement('div');f.className='float';f.textContent=txt;
  f.style.left=(r.left+r.width/2-30)+'px';f.style.top=(r.top+10)+'px';$('fx').appendChild(f);setTimeout(()=>f.remove(),1000)}

$('pauseBtn').onclick=pause;

$('trashBtn').onclick=()=>{if(R&&!R.paused&&R.tray.length){R.wasted+=R.tray.length;R.tray=[];renderTray()}};
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
intro();
</script>
</body>
</html>
