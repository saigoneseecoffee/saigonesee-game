<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Saigonesee Café Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --tile:#1F6B5C; --tile2:#26806C; --stool:#E0442F; --sun:#F2B632;
  --coffee:#4A2C1D; --paper:#FFF8EC; --ink:#2B1A10; --wood:#8A5A3B;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --tile:#164D43; --tile2:#1B5C50; --paper:#F3E6CF; --wood:#6E4730; }
}
:root[data-theme="dark"]{ --tile:#164D43; --tile2:#1B5C50; --paper:#F3E6CF; --wood:#6E4730; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--tile)}
body{
  height:100%;margin:0;color:var(--ink);
  font-family:"Baloo 2",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background-color:var(--tile);
  background-image:
    radial-gradient(circle at 50% 50%, var(--sun) 0 7%, transparent 7.5%),
    radial-gradient(circle at 0 0, var(--paper) 0 9%, transparent 9.5%),
    radial-gradient(circle at 100% 0, var(--paper) 0 9%, transparent 9.5%),
    radial-gradient(circle at 0 100%, var(--paper) 0 9%, transparent 9.5%),
    radial-gradient(circle at 100% 100%, var(--paper) 0 9%, transparent 9.5%),
    conic-gradient(from 45deg, var(--tile2) 0 25%, var(--tile) 0 50%, var(--tile2) 0 75%, var(--tile) 0);
  background-size:72px 72px;
  -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;
  overflow:hidden;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;position:relative}

/* HUD */
.hud{display:flex;align-items:center;gap:8px;padding:10px 12px 6px}
.pill{background:var(--paper);border:3px solid var(--coffee);border-radius:999px;padding:2px 12px;font-weight:800;line-height:1.5;white-space:nowrap}
.day{display:flex;flex-direction:column;line-height:1.05;background:var(--stool);color:var(--paper);border:3px solid var(--coffee);border-radius:14px;padding:4px 10px}
.day b{font-size:15px}.day span{font-size:13px;font-weight:700;opacity:.9}
.money{font-size:18px}
.stars{font-size:15px;color:var(--coffee)}
.stars i{font-style:normal;color:var(--stool)}
.hud .sp{flex:1}
.iconbtn{width:42px;height:42px;border-radius:50%;background:var(--paper);border:3px solid var(--coffee);font-size:18px;font-weight:800;box-shadow:0 3px 0 var(--coffee)}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--coffee)}

/* awning */
.awning{margin:4px 12px 0;height:22px;border-radius:10px 10px 0 0;
  background:repeating-linear-gradient(90deg,var(--stool) 0 28px,var(--paper) 28px 56px);
  border:3px solid var(--coffee);border-bottom:none;position:relative}
.sign{position:absolute;left:50%;top:-4px;transform:translateX(-50%);background:var(--coffee);color:var(--sun);
  font-weight:800;font-size:20px;padding:0 16px;border-radius:10px;letter-spacing:.5px;line-height:1.4}

/* street */
.street{margin:0 12px;flex:1;min-height:170px;display:grid;gap:8px;padding:12px 8px 0;
  background:rgba(0,0,0,.18);border-left:3px solid var(--coffee);border-right:3px solid var(--coffee);align-items:end}
.slot{display:flex;justify-content:center;align-items:flex-end;min-height:150px}
.cust{border:none;background:none;padding:0;display:flex;flex-direction:column;align-items:center;width:100%;max-width:130px;animation:walkin .35s ease-out}
@keyframes walkin{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.cust.leave{animation:leave .5s ease-in forwards}
@keyframes leave{to{transform:translateY(30px);opacity:0}}
.bubble{background:var(--paper);border:3px solid var(--coffee);border-radius:14px;padding:4px 6px 5px;width:100%;position:relative;text-align:center}
.bubble::after{content:"";position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);border:7px solid transparent;border-top-color:var(--coffee)}
.bubble .it{font-size:26px;line-height:1.1}
.bubble .nm{font-size:12.5px;font-weight:800;line-height:1.15}
.bubble .mini{font-size:12px;letter-spacing:1px;margin-top:1px}
.face{font-size:44px;line-height:1;margin-top:10px}
.bar{width:74%;height:8px;border-radius:6px;background:rgba(0,0,0,.35);margin-top:4px;overflow:hidden;border:2px solid var(--coffee)}
.bar>div{height:100%;background:var(--sun);width:100%}
.bar>div.low{background:var(--stool)}
.cust.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.cust.match .bubble{background:var(--sun)}

/* counter */
.counter{margin:0 6px;background:var(--wood);border:3px solid var(--coffee);border-radius:12px;padding:8px;display:flex;gap:8px;align-items:center;box-shadow:0 5px 0 var(--coffee)}
.tray{flex:1;min-height:52px;background:var(--paper);border:3px dashed var(--coffee);border-radius:12px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:4px 8px}
.tray .empty{font-size:14px;font-weight:700;opacity:.6}
.chip{border:none;background:none;font-size:26px;padding:0 2px;line-height:1}
.tray .res{margin-left:auto;font-weight:800;font-size:14px;background:var(--sun);border-radius:8px;padding:0 8px}
.trash{background:var(--stool);color:var(--paper);border:3px solid var(--coffee);border-radius:12px;font-weight:800;padding:8px 12px;box-shadow:0 3px 0 var(--coffee)}
.trash:active{transform:translateY(2px);box-shadow:0 1px 0 var(--coffee)}

/* station */
.station{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px 12px 8px}
.ing{background:var(--paper);border:3px solid var(--coffee);border-radius:16px;box-shadow:0 4px 0 var(--coffee);padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center}
.ing .e{font-size:28px;line-height:1.1}
.ing .n{font-size:12.5px;font-weight:700;line-height:1.1}
.ing:active{transform:translateY(3px);box-shadow:0 1px 0 var(--coffee)}
.ing.on{background:var(--sun)}
.ing{position:relative}
.ing .cnt{position:absolute;top:-8px;right:-6px;background:var(--coffee);color:var(--paper);font-size:12px;font-weight:800;border-radius:999px;min-width:22px;padding:0 5px;line-height:20px}
.ing.low .cnt{background:var(--stool)}
.ing.out{opacity:.45}
.warn{background:#FCE3DD;border:2px solid var(--stool);border-radius:10px;padding:4px 8px;font-weight:700;font-size:14px;margin-top:8px}
.tag{font-size:11px;font-weight:800;color:var(--stool)}
.crew{display:none;gap:6px;margin:0 12px;padding:6px 8px;background:rgba(0,0,0,.25);border-left:3px solid var(--coffee);border-right:3px solid var(--coffee)}
.crew.has{display:flex}
.worker{flex:1;min-width:0;background:var(--paper);border:2px solid var(--coffee);border-radius:10px;padding:2px 6px;display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700;line-height:1.2}
.worker .f{font-size:22px}.worker .w{flex:1;min-width:0}
.worker .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.worker .b{height:6px;background:rgba(0,0,0,.15);border-radius:4px;overflow:hidden;margin-top:2px}
.worker .b div{height:100%;background:var(--tile);width:0}
.tabs{display:flex;gap:6px;margin:10px 0 6px;flex-wrap:wrap}
.tabs button{flex:1;border:3px solid var(--coffee);border-radius:10px;background:var(--paper);font-weight:800;padding:2px 6px;white-space:nowrap}
.tabs.sm button{font-size:13px;border-width:2px}
.tabs .on{background:var(--sun)}
.fc{font-size:28px}
.acts{display:flex;flex-direction:column;gap:4px;align-items:stretch}
.acts select{font:inherit;font-weight:700;font-size:13px;border:2px solid var(--coffee);border-radius:8px;background:var(--paper);color:var(--ink);padding:1px 2px}
.upg button.fire{background:var(--paper);font-size:13px}
.note{font-size:13px;opacity:.8}
.sttabs{margin:10px 12px 0}
.sttabs button{font-size:13.5px}
.station.dense{grid-template-columns:repeat(5,1fr);gap:6px}
.dense .ing{border-radius:12px;padding:4px 1px 3px}
.dense .ing .e{font-size:22px}
.dense .ing .n{font-size:10.5px}
.station{padding-top:10px}
#app>.station{flex:0 1 auto;max-height:92px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  margin:6px 8px 8px;padding:12px 6px 10px;background:rgba(0,0,0,.18);border:3px solid var(--coffee);border-radius:14px;scrollbar-width:thin}
#app>.station::-webkit-scrollbar{width:5px}#app>.station::-webkit-scrollbar-thumb{background:var(--paper);border-radius:4px}
.sttabs{flex:0 0 auto}
.sttabs .bk{flex:0 0 44px!important}
.street{min-height:0;overflow:hidden;padding-top:8px}
.crew.has{padding:4px 6px;gap:4px}
.worker{padding:1px 5px;font-size:11.5px}
.worker .f{font-size:18px}
.queue{display:none;margin:0 12px;padding:3px 8px;background:rgba(0,0,0,.35);border-left:3px solid var(--coffee);border-right:3px solid var(--coffee);align-items:center;gap:5px;min-height:34px;flex-wrap:nowrap;overflow:hidden}
.queue.has{display:flex}
.ql{font-size:12px;font-weight:800;color:var(--paper);white-space:nowrap;margin-right:2px}
.qp{display:flex;flex-direction:column;align-items:center;font-size:22px;line-height:1;animation:walkin .3s ease-out}
.qp i{display:block;width:24px;height:4px;background:rgba(0,0,0,.4);border-radius:3px;margin-top:2px;overflow:hidden}
.qp b{display:block;height:100%;width:100%;background:var(--sun)}
.qp.qreg i{outline:1px solid var(--sun)}
.counter{padding:6px 8px}
.tray{min-height:44px}
.trash{padding:6px 12px}
.sttabs{margin-top:8px}
.pr{display:flex;align-items:center;gap:4px}
.pr button{min-width:34px!important;padding:2px 0!important}
.pr b{min-width:54px;text-align:center}
.vi{font-size:12px;opacity:.7;font-weight:600}
.ic{width:1.15em;height:1.15em;display:inline-block;vertical-align:-.2em}
#card .tabs:not(.sm){display:grid;grid-template-columns:repeat(3,1fr)}
#card .tabs:not(.sm) button{font-size:13px;padding:2px 2px}
.cust.regular .bubble{border-color:var(--sun);box-shadow:0 0 0 2px var(--coffee)}
.rev{background:#fff;border:2px solid rgba(74,44,29,.25);border-radius:10px;padding:4px 8px;margin:4px 0;font-size:14px;line-height:1.35}
.rev b{color:var(--stool)}
.cater{display:none;margin:0 12px;padding:4px 8px;background:var(--sun);border:3px solid var(--coffee);border-top:none;text-align:left;font-size:12.5px;line-height:1.35;color:var(--ink)}
.cater.has{display:block}
.cater .ci{display:inline-block;background:var(--paper);border-radius:6px;padding:0 5px;margin:1px 2px 0 0;font-weight:800}
.cater .ci.ok{background:#BFE3C9}
.cust.deliv .bubble{border-style:dashed}
.cust.inf .bubble{border-color:#C13584;box-shadow:0 0 0 2px #F7B6D2}
.street.dark{filter:brightness(.45)}
.street.rows2{grid-auto-rows:1fr;gap:4px 6px;padding-top:4px}
.street.rows2 .slot{min-height:0}
.street.rows2 .face{font-size:24px;margin-top:6px}
.street.rows2 .bar{height:6px;margin-top:2px}
.street.rows2 .bubble{padding:2px 2px 3px;border-width:2px;border-radius:10px}
.street.rows2 .bubble::after{bottom:-8px;border-width:5px}
.street.rows2 .who{font-size:9.5px}
.street.rows2 .oi .it{font-size:15px;line-height:1}
.street.rows2 .oi .nm{font-size:9px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.street.rows2 .oi{display:flex;flex-direction:column;align-items:center;min-width:0}
.street.rows2 .oi .nm{max-width:100%}
.street.rows2 .oi .mini{display:none}
.street.rows2 .oi+.oi{margin-top:0;padding-top:1px}
.queue{flex-shrink:0}

.bubble .who{font-size:11px;font-weight:800;color:var(--tile);line-height:1.1;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oi{border-radius:8px;padding:1px 0}
.oi+.oi{border-top:2px dotted rgba(74,44,29,.3);margin-top:2px;padding-top:3px}
.oi.byc{background:#DDF0E9}
.oi.done{opacity:.4}
.oi .by{font-size:10.5px;font-weight:800;color:var(--tile);line-height:1.1}
.cust.two .it{font-size:20px}
.cust.two .nm{font-size:11px}
.cust.two .mini{font-size:10px;letter-spacing:0}
.cust.many .oi{text-align:center}
.cust.many .oi .it{font-size:16px;line-height:1}
.cust.many .oi .nm{font-size:9.5px;line-height:1.1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cust.many .oi .mini{display:none}
.cust.many .oi .by{font-size:9px}
.cust.many .oi+.oi{margin-top:1px;padding-top:2px}
.slot{min-width:0}
.cust{min-width:0}
.cust.many .face{font-size:30px;margin-top:8px}
.street.many .nm{font-size:10.5px}
.street.many .it{font-size:20px}
.street.many .mini{font-size:9.5px;letter-spacing:0}
.street.many .face{font-size:32px}
.street.many .bubble{padding:3px 3px 4px}
.worker{flex:1 1 30%}
.crew.has{flex-wrap:wrap}
.srow{flex-wrap:wrap}
.upg .arow,.upg .posb{flex:1 1 100%!important}
.arow{display:flex;flex-wrap:wrap;gap:4px;width:100%;padding-left:38px;margin-top:4px}
.arow button,.arow select{flex:1 1 30%;min-width:0!important;background:var(--paper)!important;font-size:12.5px;padding:2px 4px!important;border-width:2px!important;border:2px solid var(--coffee);border-radius:8px;font-weight:800;color:var(--ink);font-family:inherit}
.arow button:disabled{opacity:.4}
.posb{display:flex;gap:4px;width:100%;padding-left:38px}
.posb button{flex:1;min-width:0!important;background:var(--paper)!important;font-size:12.5px;padding:1px 2px!important;border-width:2px!important}
.posb button.on{background:var(--sun)!important}
.sched{width:100%;border-collapse:collapse;margin:6px 0 8px;font-size:13px;font-weight:700;table-layout:fixed}
.sched th{background:var(--coffee);color:var(--paper);padding:3px;font-size:12.5px}
.sched td{border:2px solid var(--coffee);padding:4px;vertical-align:top;line-height:1.35}
.foot{display:flex;justify-content:center;padding:0 12px 10px}
.book{background:var(--paper);border:3px solid var(--coffee);border-radius:999px;padding:4px 18px;font-weight:800;box-shadow:0 3px 0 var(--coffee)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(20,12,6,.55);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal.show{display:flex}
.card{background:var(--paper);border:4px solid var(--coffee);border-radius:22px;max-width:420px;width:100%;max-height:88%;overflow:auto;padding:18px 18px 16px;box-shadow:0 8px 0 var(--coffee)}
.card h2{margin:0 0 4px;font-size:28px;line-height:1.1;color:var(--stool)}
.card p{margin:6px 0;line-height:1.45}
.big{display:block;width:100%;margin-top:12px;background:var(--stool);color:var(--paper);border:3px solid var(--coffee);border-radius:14px;font-size:20px;font-weight:800;padding:8px;box-shadow:0 4px 0 var(--coffee)}
.big.alt{background:var(--paper);color:var(--ink)}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 var(--coffee)}
.stat{display:flex;justify-content:space-between;font-weight:700;padding:2px 0;border-bottom:2px dotted rgba(74,44,29,.3)}
.upg{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:2px dotted rgba(74,44,29,.3)}
.upg div{flex:1;line-height:1.2}.upg small{opacity:.75;font-weight:600}
.upg button{background:var(--sun);border:3px solid var(--coffee);border-radius:10px;font-weight:800;padding:2px 10px;min-width:70px}
.upg button:disabled{opacity:.4}
.rec{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:2px dotted rgba(74,44,29,.3)}
.rec .e{font-size:28px}.rec div{flex:1;line-height:1.2}.rec .m{font-size:18px}
.new{background:var(--sun);border-radius:8px;padding:0 6px;font-size:12px;font-weight:800;margin-left:4px}

#fx{position:fixed;inset:0;pointer-events:none;z-index:15}
.float{position:absolute;font-weight:800;font-size:20px;color:var(--sun);-webkit-text-stroke:1px var(--coffee);animation:up 1s ease-out forwards}
@keyframes up{to{transform:translateY(-50px);opacity:0}}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);background:var(--coffee);color:var(--paper);padding:6px 16px;border-radius:999px;font-weight:700;z-index:16;opacity:0;transition:opacity .2s;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
@media (max-height:640px){.face{font-size:34px}.slot{min-height:120px}.street{min-height:130px}.ing .e{font-size:24px}}

/* ===== v18: uniform compact layout ===== */
#app .hud{gap:6px;padding:8px 10px 4px}
#app .pill{border-width:2px;padding:1px 10px;font-size:14px;line-height:1.6;font-variant-numeric:tabular-nums}
#app .money{min-width:92px;text-align:center}
#app .stars{min-width:108px;text-align:center}
#app .day{border-width:2px;border-radius:12px;padding:3px 8px;min-width:92px}
#app .day b{font-size:13px}#app .day span{font-size:11px;font-variant-numeric:tabular-nums}
#app .iconbtn{width:34px;height:34px;border-width:2px;font-size:14px;box-shadow:0 2px 0 var(--coffee)}
#app .awning{height:18px;margin:4px 10px 0;border-width:2px}
#app .sign{font-size:16px;top:-3px;padding:0 12px}
#app .queue,#app .cater,#app .crew{margin:0 10px;border-width:2px}
#app .queue{min-height:30px;height:30px;padding:2px 8px}
#app .qp{font-size:18px}#app .qp i{width:20px;height:3px}
#app .cater{font-size:11.5px;padding:3px 8px}
#app .street{margin:0 10px;border-left-width:2px;border-right-width:2px;padding:6px 6px 4px;gap:6px;align-items:stretch}
#app .slot{height:100%;min-height:0;display:flex;align-items:flex-end;justify-content:center}
#app .cust{height:100%;max-height:215px;width:100%;max-width:none;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-end}
#app .bubble{flex:1 1 auto;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:center;border-width:2px;border-radius:12px;padding:3px 4px 4px}
#app .bubble::after{border-width:6px;bottom:-12px}
#app .bubble .who{flex:0 0 auto}
#app .face{flex:0 0 auto;font-size:30px;margin-top:8px;text-align:center}
#app .bar{flex:0 0 auto;width:70%;margin:3px auto 0;height:6px;border-width:1.5px}
#app .street.rows2 .face{font-size:22px;margin-top:6px}
#app .street.rows2 .cust{max-height:none}
#app .crew.has{padding:3px 5px;gap:3px}
#app .worker{flex:1 1 30%;padding:1px 5px;font-size:11px;border-width:1.5px;border-radius:8px}
#app .worker .f{font-size:16px}
#app .counter{margin:0 6px;padding:5px 6px;gap:6px;border-width:2px;border-radius:10px;box-shadow:0 3px 0 var(--coffee)}
#app .tray{min-height:40px;height:40px;overflow:hidden;border-width:2px;border-radius:10px;padding:2px 6px;flex-wrap:nowrap}
#app .tray .empty{font-size:12.5px}
#app .chip{font-size:22px}
#app .tray .res{font-size:12px;white-space:nowrap}
#app .trash{border-width:2px;border-radius:10px;padding:0 12px;height:40px;font-size:14px;box-shadow:0 2px 0 var(--coffee)}
#app .sttabs{margin:6px 10px 0;gap:5px;display:grid;grid-template-columns:repeat(3,1fr) 36px}
#app .sttabs button{border-width:2px;border-radius:9px;font-size:12.5px;padding:3px 2px;height:30px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#app .sttabs .bk{flex:none!important}
#app>.station{grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:6px;margin:5px 8px 8px;padding:10px 6px 6px;border-width:2px;border-radius:12px;max-height:84px}
#app .ing{height:62px;border-width:2px;border-radius:11px;box-shadow:0 3px 0 var(--coffee);padding:3px 2px 2px;justify-content:center;min-width:0}

function evalCombo(sel){

    GOOD.forEach(([x,y])=>{if((a.includes(x)&&b.includes(y))||(a.includes(y)&&b.includes(x)))good++});
    BAD.forEach(([x,y])=>{if((a.includes(x)&&b.includes(y))||(a.includes(y)&&b.includes(x)))bad++})}

  return {kind,base,flav,stars,top,tips};

function musicSet(on){if(on){MTimer=1;musicLoad().then(a=>{if(a&&SET.music)a.play().catch(()=>{})})}else{MTimer=null;if(MUS)MUS.pause()}}
function musicVolume(){if(SET.music)musicLoad()}

function saveBlob(){return {game:'saigonesee',v:1,at:new Date().toISOString(),S,settings:SET,lang:LANG,hof:(()=>{try{return JSON.parse(localStorage.getItem('saigonesee-hof')||'[]')}catch(e){return []}})()}}
function exportSave(){save();const data=JSON.stringify(saveBlob());const name=`saigonesee-${(S.player||'player').replace(/[^\w-]+/g,'_')}-day${S.day}.json`;
  try{const f=new File([data],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:'Saigonesee save'}).catch(()=>{});return}}catch(e){}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast(L('💾 Save file downloaded','💾 Đã tải file lưu game'))}
function applyLoad(txt){let d;try{d=JSON.parse(txt.trim().startsWith('{')?txt:decodeURIComponent(escape(atob(txt.trim()))))}catch(e){toast(L('That file or code is not a Saigonesee save','File hoặc mã này không phải bản lưu Saigonesee'));return}
  if(!d||d.game!=='saigonesee'||!d.S||!d.S.day){toast(L('That file or code is not a Saigonesee save','File hoặc mã này không phải bản lưu Saigonesee'));return}
  if(!confirm(L(`Load ${d.S.player||'this'} save (day ${d.S.day})? Your current progress on this device will be replaced.`,`Mở bản lưu của ${d.S.player||'người chơi'} (ngày ${d.S.day})? Tiến độ hiện tại trên máy này sẽ bị thay thế.`)))return;
  try{localStorage.setItem(KEY,JSON.stringify(d.S));if(d.settings)localStorage.setItem('saigonesee-settings',JSON.stringify(d.settings));if(d.lang)localStorage.setItem('saigonesee-lang',d.lang);if(d.hof)localStorage.setItem('saigonesee-hof',JSON.stringify(d.hof))}catch(e){}
  location.reload()}
function importFile(inp){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>applyLoad(String(r.result));r.readAsText(f);inp.value=''}
function copyCode(){save();const code=btoa(unescape(encodeURIComponent(JSON.stringify(saveBlob()))));
  const done=()=>toast(L('📋 Save code copied. Paste it on the other device','📋 Đã chép mã. Dán vào máy kia nhé'));
  if(navigator.clipboard)navigator.clipboard.writeText(code).then(done).catch(()=>prompt(L('Copy this code','Chép mã này'),code));else prompt(L('Copy this code','Chép mã này'),code)}

}

// How well an item fits the season: >1 featured, <0.5 rests off the menu (seasonal menu only)
function seasonFit(r,sea){const I=r.ing,n=(r.n||'').toLowerCase(),hot=r.hot||/\bhot\b/.test(n),iced=I.includes('ice'),fruit=I.some(k=>['mango','straw','peach','pineapple','lime','orange','citron','coconut','slmix'].includes(k));
  if(sea==='Summer'){if(hot)return .3;if(iced&&fruit)return 1.6;if(iced)return 1.2}
  if(sea==='Winter'){if(hot)return 1.7;if(iced&&fruit&&r.k==='drink')return .4;if(r.k==='food')return 1.2}
  if(sea==='Fall'){if(I.some(k=>['biscoff','tfoam','cacao','brownsugar'].includes(k))||hot)return 1.4}
  if(sea==='Spring'){if(I.some(k=>['matcha','mfoam','straw','pandan'].includes(k)))return 1.4}
  return 1}
function pickRec(list){
  const u=list||onMenu(),wx=WX[S.wx.t];const sea=season(S.day)[0],hotW=(wx.hot||1)*(sea==='Winter'?1.5:sea==='Fall'?1.2:sea==='Summer'?.6:1);
  const hol=holiday(S.day),w=u.map(r=>(boardOn('cpo','season')?seasonFit(r,sea)*(hol&&S.newIds.includes(r.id)?1.2:1):1)*(r.k==='drink'?(r.hot?hotW:(wx.drink||1)):(wx.food||1))*(S.newIds.includes(r.id)?2.2:1)*(R&&R.special===r?3:1)*Math.pow(1/pRatio(r),2.5));
  let x=Math.random()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<u.length;i++){x-=w[i];if(x<=0)return u[i]}return u[0];
}
function makeOrder(){
  const busy=[...R.cust.filter(Boolean),...R.queue];
  const pool=S.regs.filter(g=>!busy.some(x=>x.reg===g));
  const reg=pool.length&&Math.random()<Math.min(.3,S.regs.length*.03)?pick(pool):null;
  const first=reg&&Math.random()<.7&&S.known.includes(reg.usual)?REC.find(r=>r.id===reg.usual):pickRec();
  const x=Math.random(),n=S.day<=2?(x<.8?1:2):S.day<=5?(x<.6?1:x<.88?2:3):(x<.52?1:x<.8?2:x<.94?3:4);
  const recs=[first];
  for(let i=1;i<n;i++){
    const dup=Math.random()<.15?first:null;                      // e.g. two of the same coffee
    const want=Math.random()<.55?'drink':'food',pool=unlocked().filter(r=>r.k===want);
    recs.push(dup||(pool.length?pickRec(pool):pickRec()));

const LOANS=[{amt:1000,rate:.01,days:15},{amt:5000,rate:.012,days:20},{amt:20000,rate:.015,days:30,req:3}];
const avgProfit=()=>{const h=S.hist.slice(-7);return h.length?h.reduce((a,x)=>a+x.p,0)/h.length:0};
function valuation(){return Math.round(Math.max(0,avgProfit())*30+2000+S.branches.reduce((a,id)=>a+LOC[id].cost*(1+.6*(S.brLvl[id]||0))*.5,0)+S.known.length*40)}
const payoff=l=>Math.round(l.amt*l.left/l.days);
function taxSection(){initTax();const T=S.tax,left=TAX.quarter-((S.day-1)%TAX.quarter),est=Math.max(0,T.qProfit+T.qInv)*(TAX.fed+TAX.ma)*(boardOn('cfo','tax')?.9:1);
  const r=(a,b)=>`<div class="stat"><span>${a}</span><span>${b}</span></div>`;
  return `<p style="margin-top:14px;font-weight:800">🧾 Taxes (Massachusetts)</p>
  ${T.owed>0?`<div class="warn">Overdue income tax: <b>${fmt(T.owed)}</b>. It is paid automatically from cash each night.</div>`:''}
  ${r('Next quarterly payment','in '+left+' day'+(left>1?'s':''))}
  ${r('Taxable profit this quarter',fmt(T.qProfit+T.qInv))}
  ${r('Estimated income tax',fmt(Math.max(est,TAX.maMin/4)))}
  <details class="srcgrp"><summary>Tax rates and totals paid</summary>
  ${r('Meals tax (6.25% MA + 0.75% Weymouth)','7% · '+fmt(T.paid.meals))}
  ${r('Payroll: Social Security 6.2%, Medicare 1.45%, FUTA 0.6%, MA UI/PFML ~2.4%',fmt(T.paid.payroll))}
  ${r('Income: federal 21% + MA excise 8% (min $456/yr)',fmt(T.paid.income))}
  ${r('Property: ~1.1% homes, ~2.2% commercial per year',fmt(T.paid.property))}
  ${T.hist.length?'<p class="note" style="margin-top:6px">Recent quarters: '+T.hist.map(h=>`day ${h.d}: ${fmt(h.due)}`).join(' · ')+'</p>':''}
  <p class="note">Meals tax is paid by customers on top of menu prices, so it doesn't cut your profit. Rates are simplified for the game; real taxes depend on your business type.</p></details>`}
function takeLoan(i){const o=LOANS[i];if(S.loans.length>=2)return;S.money+=o.amt;S.loans.push({amt:o.amt,days:o.days,left:o.days,pay:Math.round(o.amt*(1+o.rate*o.days)/o.days*100)/100});save();sfx.coin();toast('🏦 Borrowed '+fmt(o.amt));manage()}
function payOff(i){const l=S.loans[i],c=payoff(l);if(S.money<c)return;S.money-=c;S.loans.splice(i,1);save();toast('🏦 Loan paid off');manage()}
function ipo(){const v=valuation();if(v<25000||S.ipo.sold)return;S.money+=v*.2;S.ipo.sold=.2;save();sfx.coin();toast('🔔 Saigonesee is now a public company!');manage()}
function shares(d){const v=valuation();if(d>0){if(S.ipo.sold>=.49)return;S.money+=v*.095;S.ipo.sold=Math.min(.49,S.ipo.sold+.1)}else{if(S.money<v*.105)return;S.money-=v*.105;S.ipo.sold=Math.max(0,Math.round((S.ipo.sold-.1)*100)/100)}save();manage()}
function acceptCat(id){const o=S.catOffers.find(x=>x.id===id);if(!o||S.catJob)return;S.catJob=o;S.catOffers=S.catOffers.filter(x=>x!==o);save();toast('📦 Catering booked for today');manage()}
let LBP=null;
function takeName(){const el=$('pname0');const v=(el&&el.value||'').trim().slice(0,16);
  if(!v){el.classList.add('need');el.focus();toast('Please type your name first');return false}
  S.player=v;save();return true}
// Money invested in upgrades and equipment still counts toward the score
function upgValue(){return UPG.filter(u=>u.id).reduce((a,u)=>{let v=0;for(let i=0;i<(S.upg[u.id]||0);i++)v+=u.base*Math.pow(1.6,i);return a+v},0)}
function staffValue(){return S.staff.reduce((a,x)=>a+30*lvl(x),0)}
function farmValue(){return S.farm?S.farm.plots.reduce((a,p)=>a+REGIONS[p.r].plot+(p.v?VARS[p.v].plant:0),0)+(S.farm.factory?FACT.slice(1,S.farm.factory+1).reduce((a,f)=>a+f.cost,0)*.7:0)+(S.farm.pack?5600:0):0}
function funValue(){initFun();return TEAMS.filter(x=>x.kind==='team'&&S.fun.own[x.id]).reduce((a,x)=>a+x.price*.9,0)}
function companyScore(){return funValue()+farmValue()+portfolio()+valuation()+Math.max(0,S.money)+upgValue()*.9+staffValue()+Object.keys(S.board||{}).filter(k=>S.board[k].on).reduce((a,k)=>a+EXECS[k].fee*.5,0)}
function saveScore(reason){
  if(!S.pid){S.pid=Math.random().toString(36).slice(2,10)+Date.now().toString(36);save()}
  const e={pid:S.pid,name:S.player||'Player',day:S.day,value:Math.round(companyScore()),branches:S.branches.length,at:Date.now(),why:reason||''};
  let hof=[];try{hof=JSON.parse(localStorage.getItem('saigonesee-hof')||'[]')}catch(x){}
  const k=hof.findIndex(x=>x.pid===e.pid&&x.run===S.run);
  if(k>=0){if(e.value>=hof[k].value)hof[k]={...e,run:S.run};else hof[k].name=e.name}else hof.push({...e,run:S.run});
  hof.sort((a,b)=>b.value-a.value);hof=hof.slice(0,10);try{localStorage.setItem('saigonesee-hof',JSON.stringify(hof))}catch(x){}
  if(LB_URL){try{LBP=fetch(LB_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(e)}).catch(()=>{})}catch(x){}}
  fbSave(e);S.lastPost=e.value;S.lastPostAt=Date.now();save();
  return hof;
}

function autoPost(reason){if(!S.player)return;if(Date.now()-(S.lastPostAt||0)<60000&&reason!=='closed')return;if(Math.round(companyScore())===S.lastPost)return;saveScore(reason)}

const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};

function finDay(){

    if(Math.random()<.06){const up=Math.random()<.55,j=(t.vol>.08?.25:.08)+Math.random()*(t.vol>.08?.5:.15);r+=up?j:-j;log.push(`📰 ${t.e} ${t.n} ${up?pick(NEWS_UP):pick(NEWS_DN)} (${up?'+':'-'}${Math.round(j*100)}%)`)}
    F.px[t.sym]=Math.max(.05,+(F.px[t.sym]*Math.exp(r)).toFixed(2));F.hist[t.sym].push(F.px[t.sym]);if(F.hist[t.sym].length>30)F.hist[t.sym].shift();
    const h=F.hold[t.sym];if(h&&h.sh&&t.div)div+=h.sh*F.px[t.sym]*t.div*(1+.05*dp('fin'))});
  {const mk=F.hist.MKT,g=F.px.GOLD;if(mk&&mk.length>1&&g){const d=mk[mk.length-1]/mk[mk.length-2]-1;if(d<-.01){F.px.GOLD=+(g*(1-d*.5)).toFixed(2);F.hist.GOLD[F.hist.GOLD.length-1]=F.px.GOLD}}}
  int=F.save*BANK.save;F.save+=int;
  F.cds.forEach(c=>{const g=c.amt*c.rate;c.amt+=g;int+=g;c.left--});
  F.cds.filter(c=>c.left<=0).forEach(c=>{F.save+=c.amt;log.push(`🏦 A ${c.days}-day CD matured: ${fmt(c.amt)} moved to savings`)});F.cds=F.cds.filter(c=>c.left>0);

  S.money+=div+rent;F.inc.div+=div;F.inc.int+=int;F.inc.rent+=rent;

function labTeam(){
  const L=S.lab;if(!L.team.length)return;let pay=0;const found=[];
  const avail=k=>ING[k]&&(!ING[k].src||L.src.includes(k))&&ING[k].tags;
  const pool=Object.keys(ING).filter(k=>avail(k)&&(needSet().has(k)||L.src.includes(k)));
  const dBases=['tea','phin','milk','soda','espresso','coldbrew','matcha',...pool.filter(k=>ING[k].world&&(ING[k].tags||[]).some(t=>t==='tea'||t==='coffee'))].filter(k=>pool.includes(k));
  const fBases=['baguette','bun','ricepaper','bao','croissant','sticky'].filter(k=>pool.includes(k));
  const flavPool=pool.filter(k=>!DRINK_BASES[k]&&!FOOD_BASES[k]&&!FILLERS.includes(k));
  L.team.forEach(x=>{pay+=x.wage;const tries=1+Math.floor(x.skill/2);
    for(let t=0;t<tries;t++){if(S.money<10)break;S.money-=10;pay+=10;
      // chase a lead first
      const lead=L.leads.map(id=>DISCO.find(d=>d.id===id)).find(d=>d&&d.ing.every(avail)&&(x.spec==='both'||x.spec===d.k));
      if(lead&&Math.random()<.2+.12*x.skill){L.found.push(lead.id);L.leads=L.leads.filter(i=>i!==lead.id);REC.push({...lead,d:1,inv:1});S.known.push(lead.id);S.newIds=[...(S.newIds||[]),lead.id];x.found=(x.found||0)+1;found.push(`${x.face} ${x.name} cracked the idea: ${lead.e} ${lead.n}!`);continue}
      // otherwise try a few random combos and keep the best
      const kind=x.spec==='both'?(Math.random()<.5?'drink':'food'):x.spec,bases=kind==='drink'?dBases:fBases;if(!bases.length||flavPool.length<2)continue;
      let best=null;for(let s2=0;s2<x.skill*3;s2++){const b=pick(bases),n=1+Math.floor(Math.random()*3),fl=[];while(fl.length<n){const f=pick(flavPool);if(!fl.includes(f))fl.push(f)}
        const sel=[b,...fl];if(kind==='drink'&&pool.includes('ice'))sel.push('ice');if(REC.some(r=>same(r.ing,sel)))continue;const ev=evalCombo(sel);if(!ev.fail&&(!best||ev.stars>best.ev.stars))best={sel,ev}}
      if(best&&best.ev.stars>=3.5){const d=makeCustom(best.sel,best.ev);if(!REC.some(r=>r.id===d.id)){L.custom.push(d);REC.push({...d,d:1,inv:1});S.known.push(d.id);S.newIds=[...(S.newIds||[]),d.id];x.found=(x.found||0)+1;found.push(`${x.face} ${x.name} invented ${d.e} ${d.n} (${d.stars}★)`)}}
    }});
  S.money-=L.team.reduce((a,x)=>a+x.wage,0);R.labPay=pay;found.forEach(f=>R.news.push('🧪 '+f));
  if(!found.length)R.news.push('🧪 The research team ran experiments but found nothing new tonight');
}

function sourceIng(k){const fee=srcFee(k);if(S.money<fee||S.lab.src.includes(k))return;S.money-=fee;S.lab.src.push(k);S.inv[k]=(S.inv[k]||0)+ING[k].q;save();sfx.coin();toast('🌏 Found a supplier for '+ING[k].n+'. First batch is free!');manage()}
function labTest(){
  const L=S.lab,sel=L.sel.slice();if(sel.length<2||S.money<LAB_FEE||!sel.every(hasIng))return;
  S.money-=LAB_FEE;S.spend+=LAB_FEE;sel.forEach(k=>S.inv[k]--);L.tries++;
  const d=DISCO.find(x=>!L.found.includes(x.id)&&same(x.ing,sel));
  if(d){L.found.push(d.id);L.leads=L.leads.filter(x=>x!==d.id);REC.push({...d,d:1,inv:1});S.known.push(d.id);S.newIds=[...(S.newIds||[]),d.id];
    L.last={ok:1,msg:`🎉 <b>Eureka! ${d.e} ${d.n}</b> (${d.vi}) is on the menu at ${fmt(d.p)}.<br><small>🏪 Real-life idea: ${d.idea}</small>`};L.sel=[];sfx.coin();
    S.buzz=Math.min(.5,S.buzz+.04);toast('🎉 New item invented: '+d.n)}
  else{
    const known=DISCO.find(x=>L.found.includes(x.id)&&same(x.ing,sel))||REC.find(r=>same(r.ing,sel));
    let best=null,bo=0;DISCO.filter(x=>!L.found.includes(x.id)).forEach(x=>{const o=x.ing.filter(k=>sel.includes(k)).length;const sc=o-Math.abs(x.ing.length-sel.length)*.5;if(sc>bo){bo=sc;best=x}});
    const ev=known?null:evalCombo(sel);
    if(known)L.last={msg:`😅 That's the ${known.n}. It's already on your menu!`};
    else if(ev&&!ev.fail&&ev.stars>=3.5){
      {const d=makeCustom(sel,ev);L.custom.push(d);REC.push({...d,d:1,inv:1});S.known.push(d.id);S.newIds=[...(S.newIds||[]),d.id];
        L.last={ok:1,msg:`🎉 <b>New creation! ${d.e} ${d.n}</b> scored ${'★'.repeat(Math.floor(d.stars))}${d.stars%1?'½':''} and joins the menu at ${fmt(d.p)}.<br><small>🏪 Real-life idea: ${d.idea}</small>`};L.sel=[];
        S.buzz=Math.min(.5,S.buzz+.03);sfx.coin();save();manage();return}}
    else if(ev&&!ev.fail&&ev.stars>=3)L.last={close:1,msg:`😋 ${'★'.repeat(Math.floor(ev.stars))} Pretty tasty, but not menu-worthy yet. Try swapping one flavor.${ev.tips.length?' Tasters noticed: '+ev.tips.join(', ')+'.':''}`};
    else if(ev&&ev.fail&&!best)L.last={msg:'🧪 '+ev.fail};
    else if(best&&best.ing.filter(k=>sel.includes(k)).length>=best.ing.length-1&&Math.abs(best.ing.length-sel.length)<=1){
      const miss=best.ing.find(k=>!sel.includes(k)),extra=sel.find(k=>!best.ing.includes(k));
      L.last={close:1,msg:`🤏 <b>So close!</b> Tasters loved it but something is off. ${extra?`Maybe swap out the ${ING[extra].n}`:'It needs one more thing'}${miss&&(ING[miss].src&&!L.src.includes(miss))?'. The missing piece is an ingredient you haven\'t sourced yet.':'.'}`}}
    else if(best&&bo>=2)L.last={close:1,msg:`🤔 Interesting… ${ING[best.ing.find(k=>sel.includes(k))].e} ${ING[best.ing.find(k=>sel.includes(k))].n} has potential here. Keep experimenting!`};
    else L.last={msg:(ev&&ev.fail?'🧪 '+ev.fail:pick(['😖 Tasters made a face. Try a different mix.','🙃 That was… creative. Not quite.','🥴 Nope. Back to the drawing board.'])+(ev&&ev.tips&&ev.tips.length?' They noticed: '+ev.tips.join(', ')+'.':''))};
    sfx.bad();
  }
  save();manage();
}

function runBoard(){

  if(boardOn('cfo','prices')&&R.balked>=3){let n=0;unlocked().forEach(r=>{if(pRatio(r)>1.15){S.prices[r.id]=Math.round((price(r)-.25)*4)/4;n++}});if(n)log.push('🧑‍💼 Lowered prices on '+n+' items after customers balked')}

// Target stock: last day's usage + 40% + 20 extra. Items not used last day keep a small buffer of 5.
function needFor(k){const u=S.lastUsed[k]||0;return u>0?Math.ceil(u*1.4)+20:5}
// Restock always keeps 30 extra on top of the need for anything used last day
function restockTo(k){const u=S.lastUsed[k]||0;return needFor(k)+(u>0?30:0)}
function restock(){S.spike=S.spikeNext;
  let spent=0,miss=0;
  ING_ORDER.filter(k=>needSet().has(k)).forEach(k=>{
    while((S.inv[k]||0)<restockTo(k)){const c=ingPrice(k);if(S.money<c){miss++;break}S.money-=c;spent+=c;S.spend+=c;S.inv[k]=(S.inv[k]||0)+ING[k].q}});
  save();sfx.coin();toast(miss?'Ran out of cash before restocking everything':'Restocked for '+fmt(spent));market();
}
const MGROUPS=[['bar','☕ Bar'],['top','🍓 Toppings'],['kit','🥖 Kitchen'],['world','🌏 Sourced from the Lab']];
const mgOf=k=>ING[k].world||(ING[k].src&&!['bar','top','kit'].includes(ING[k].st))?'world':ING[k].src?'world':ING[k].st;
function restockGroup(g){const need=needSet();let spent=0;ING_ORDER.filter(k=>need.has(k)&&mgOf(k)===g).forEach(k=>{while((S.inv[k]||0)<restockTo(k)){const c=ingPrice(k);if(S.money<c)break;S.money-=c;spent+=c;S.spend+=c;S.inv[k]=(S.inv[k]||0)+ING[k].q}});save();sfx.coin();toast('Restocked for '+fmt(spent));const sc=$('card').scrollTop;market();$('card').scrollTop=sc}
function market(){
  R=null;S.spike=S.spikeNext||null;hud();buildStation();
  const need=needSet(),keys=ING_ORDER.filter(k=>need.has(k));
  const cost=k=>{let h=S.inv[k]||0,e=0;while(h<restockTo(k)){h+=ING[k].q;e+=ingPrice(k)}return e};
  const est=keys.reduce((a,k)=>a+cost(k),0);
  const row=k=>{const g=ING[k],have=S.inv[k]||0,nd=needFor(k),low=have<nd;
    return `<div class="mrow"><span class="mic">${g.e}</span><div class="minfo"><b>${g.n}</b><small class="${low?'lowtxt':''}">📦 ${have} left · need ~${nd} · restock to ${restockTo(k)}</small><small>1 ${g.u} = ${g.q} servings${g.per&&!S.upg.tu&&!S.upg.smartfridge?' · <span class="tag">spoils overnight</span>':''}</small></div><div class="mbtns"><button class="mbuy" data-k="${k}" data-n="1" ${S.money<ingPrice(k)?'disabled':''}><b>${fmt(ingPrice(k))}</b><span>Buy</span></button><button class="mbulk" data-k="${k}" data-n="5" ${S.money<ingPrice(k)*4.25?'disabled':''}>×5 · ${fmt(ingPrice(k)*4.25)}</button></div></div>`};
  const groups=MGROUPS.map(([g,n])=>{const ks=keys.filter(k=>mgOf(k)===g);if(!ks.length)return '';
    const low=ks.filter(k=>(S.inv[k]||0)<needFor(k)).length,gc=ks.reduce((a,k)=>a+cost(k),0),key='mkt:'+g;
    return `<details class="srcgrp mgrp" data-key="${key}"${OPEN.has(key)?' open':''}><summary><span class="mgn">${n} <small>(${ks.length})</small></span>${low?`<span class="mlow">⚠️ ${low} low</span>`:'<span class="mok">✓ OK</span>'}</summary>
      ${gc?`<button class="flyall" onclick="restockGroup('${g}')">🛒 Restock ${n.replace(/^\S+\s/,'')} · ${fmt(gc)}</button>`:''}${ks.map(row).join('')}</details>`}).join('');
  const miss=unlocked().filter(r=>r.ing.some(k=>!(S.inv[k]>0))).map(r=>r.n);

  <div class="mtop">${est?`<button class="big alt" onclick="restock()">🛒 Restock everything · ${fmt(est)}</button>`:'<p class="note" style="text-align:center">✓ Everything is stocked for a day like the last one.</p>'}
  <button class="big" onclick="startDay()">Open day ${S.day}</button></div>
  ${miss.length?`<div class="warn">Not enough ingredients for: ${miss.slice(0,6).join(', ')}${miss.length>6?' and '+(miss.length-6)+' more':''}</div>`:''}
  <p class="note notr">${L("Restock tops up to last day's need (+40% +20) plus 30 extra. Tap a group to buy items one by one.","Nút mua đủ sẽ nhập theo nhu cầu hôm qua (+40% +20) và dư thêm 30. Chạm vào một nhóm để mua từng món.")} ${S.upg.supplier?L('📦 Your supplier contract also restocks when you open. ','📦 Hợp đồng nhà cung cấp cũng tự nhập hàng khi mở cửa. '):''}${L('Branches order their own ingredients.','Chi nhánh tự nhập hàng.')}</p>
  ${groups}
  <button class="big alt" onclick="manage()">Manage shop</button>`,()=>market());
  document.querySelectorAll('#card button[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k,g=ING[k],n=+b.dataset.n,c=n===5?ingPrice(k)*(S.upg.freezer&&PROTEINS.includes(k)?3.75:S.upg.shelving?4:4.25):ingPrice(k);
    if(S.money<c)return;S.money-=c;S.spend+=c;S.inv[k]=(S.inv[k]||0)+g.q*n;save();sfx.coin();
    const sc=$('card').scrollTop;market();$('card').scrollTop=sc});
}

a thiết bị như máy espresso hay nồi chiên để mở thêm món. Bật app giao hàng và đặt trước để có thêm đơn.", "Buy land in Vietnam's coffee regions, plant varieties, and hire farmers to pick the cherries. Each farmer covers about 3–5 plots. Farm efficiency now:": "Mua đất ở các vùng cà phê Việt Nam, trồng giống và thuê nông dân hái trái. Mỗi nông dân lo khoảng 3–5 lô. Hiệu suất nông trại hiện tại:", "Buy property to collect rent every day. Property values go up and down slowly. Selling costs a 5% fee. Now and then a property needs repairs.": "Mua nhà đất để thu tiền thuê mỗi ngày. Giá nhà lên xuống chậm. Bán mất phí 5%. Thỉnh thoảng phải sửa chữa.", "Company value:": "Giá trị công ty:", "Customers grab a bag on the way out": "Khách mua bịch khi ra về", "Delivery orders (🛵 🚗 🥡) show up at Weymouth with a dashed bubble. Each app keeps 30% and there's no tip, but you get extra orders everywhere. 📱 Online pickup has no commission: customers order ahead, wait longer and still tip a little.": "Đơn giao hàng (🛵 🚗 🥡) hiện ở Weymouth với phiếu viền đứt. Mỗi app lấy 30% và không có tip, nhưng có thêm đơn ở mọi nơi. 📱 Đặt trước không mất hoa hồng: khách đặt sẵn, chờ lâu hơn và vẫn tip chút ít.", "Directors run parts of the company for you each night after closing. They only spend money above your cash reserve.": "Ban giám đốc điều hành công ty giúp bạn mỗi tối sau khi đóng cửa. Họ chỉ tiêu phần tiền vượt quỹ dự phòng.", "Each team works for its director. Without the director on the 👔 Board, a team works at half strength. More seats come with the 🏢 Regional office upgrade. Office rent is $15 per desk per day.": "Mỗi phòng làm việc cho giám đốc của mình. Không có giám đốc trong 👔 Ban giám đốc thì phòng chỉ làm được một nửa. Thêm chỗ ngồi bằng nâng cấp 🏢 Văn phòng khu vực. Tiền thuê $15 mỗi chỗ mỗi ngày.", "Equipment works at every location. Some machines unlock new menu items in 🔬 R&D.": "Thiết bị dùng cho mọi tiệm. Một số máy mở món mới trong 🔬 R&D.", "Expand branches that turn customers away": "Mở rộng chi nhánh đang từ chối khách", "Find a supplier once, then buy it at the market like anything else. The first batch is free.": "Tìm nhà cung cấp một lần, sau đó mua ở chợ như mọi thứ khác. Lô đầu miễn phí.", "Give a bonus when someone is unhappy": "Thưởng khi nhân viên buồn", "Hire staff wherever they are needed, busiest spots first": "Tuyển người ở nơi cần, chỗ đông nhất trước", "Interest earned so far:": "Tiền lãi tới giờ:", "Last night:": "Tối qua:", "Lock money away for more interest. Taking it out early loses all the interest.": "Gửi có kỳ hạn để lãi cao hơn. Rút trước hạn mất hết tiền lãi.", "Lower prices when customers walk out over them": "Hạ giá khi khách bỏ đi vì đắt", "Meals tax is paid by customers on top of menu prices, so it doesn't cut your profit. Rates are simplified for the game; real taxes depend on your business type.": "Thuế bữa ăn do khách trả thêm trên giá menu nên không trừ vào lời. Mức thuế đã giản lược cho game; thuế thật tuỳ loại hình doanh nghiệp.", "No competitors nearby right now.": "Hiện chưa có đối thủ gần đây.", "No scores yet.": "Chưa có điểm.", "Nothing new to research right now.": "Hiện chưa có món mới để nghiên cứu.", "On this device": "Trên máy này", "Pay off loans early": "Trả nợ vay sớm", "Pick every ingredient. Order doesn't matter.": "Chọn đủ nguyên liệu. Thứ tự không quan trọng.", "Plan deductions: 10% less income tax": "Tìm khoản khấu trừ: giảm 10% thuế thu nhập", "Price changes each night.": "Giá thay đổi mỗi đêm.", "Profit history shows up after your first day.": "Lịch sử lợi nhuận sẽ hiện sau ngày đầu tiên.", "Property: ~1.1% homes, ~2.2% commercial per year": "Nhà đất: ~1.1% nhà ở, ~2.2% thương mại mỗi năm", "Rent collected so far:": "Tiền thuê thu được tới giờ:", "Research new menu items": "Nghiên cứu món mới", "Research new menu items in 🔬 R&D, run marketing, beat competitors and turn customers into regulars. The game has no day limit.": "Nghiên cứu món mới trong 🔬 R&D, chạy marketing, vượt đối thủ và biến khách thành khách quen. Game không giới hạn số ngày.", "Researchers experiment every night on their own, using ingredients you've sourced. Higher skill finds better recipes. They also chase the team's ideas. Salaries:": "Nghiên cứu viên tự thử nghiệm mỗi đêm bằng nguyên liệu bạn đã tìm được. Tay nghề cao tìm ra công thức ngon hơn. Họ cũng giải các ý tưởng của team. Lương:", "Restock Weymouth every morning": "Nhập hàng cho Weymouth mỗi sáng", "Run ads when buzz drops or a competitor opens": "Chạy quảng cáo khi độ nổi tiếng giảm hoặc có đối thủ mở", "Scores save automatically every couple of minutes while you play. Score = company value + cash + everything you've invested in the shop. Your company right now:": "Điểm tự lưu vài phút một lần khi bạn chơi. Điểm = giá trị công ty + tiền mặt + mọi khoản đầu tư vào tiệm. Công ty của bạn hiện tại:", "Sell some items first.": "Bán vài món trước đã.", "Sell your own roasted coffee in 500 g bags. Needs a roastery and packaging line.": "Bán cà phê tự rang theo bịch 500 g. Cần có nhà máy rang và dây chuyền đóng gói.", "Serve customers quickly and some will become regulars. Regulars wait longer and tip more.": "Phục vụ nhanh thì một số khách sẽ thành khách quen. Khách quen chờ lâu hơn và tip nhiều hơn.", "Set staff positions at Weymouth": "Tự xếp vị trí nhân viên ở Weymouth", "Set your own prices. Higher prices earn more per order but bring fewer customers, smaller tips and lower ratings. Some customers walk out if it's too pricey.": "Tự đặt giá bán. Giá cao lời hơn mỗi đơn nhưng ít khách hơn, tip ít hơn và bị đánh giá thấp. Quá đắt thì một số khách bỏ đi.", "Some staff can flex between Bar and Kitchen. Set everyone's position in the schedule. After closing, set your prices, hire staff, pay wages and open new branches.": "Một số nhân viên làm được cả Quầy bar và Bếp. Xếp vị trí cho mọi người trong lịch làm. Sau giờ đóng cửa, đặt giá, thuê người, trả lương và mở chi nhánh.", "Switch between the Bar and Kitchen to find ingredients. Stock up at the market before each day. Baguettes, milk, greens and foams spoil overnight.": "Chuyển giữa Quầy bar và Bếp để tìm nguyên liệu. Đi chợ trước mỗi ngày. Bánh mì, sữa, rau và foam để qua đêm sẽ hư.", "Tap a stock to buy or sell. Prices move every night, so they can go up or down. Spread your money out to be safer.": "Chạm vào một mã để mua bán. Giá đổi mỗi đêm, có thể lên hoặc xuống. Chia tiền ra nhiều mã cho an toàn.", "Total:": "Tổng:", "Waiting for roasted beans…": "Đang chờ cà phê rang…", "Watch the weather and holidays, take catering orders, borrow from the bank or take your company public, and climb the 🏆 leaderboard.": "Theo dõi thời tiết và ngày lễ, nhận đơn catering, vay ngân hàng hoặc đưa công ty lên sàn, và leo 🏆 bảng xếp hạng.", "bags in the warehouse": "bịch trong kho", "bags packed ·": "bịch đã đóng ·", "no staff": "chưa có người", "🌏 Source ingredients from around the world": "🌏 Tìm nguyên liệu khắp thế giới", "👥 HR team": "👥 Phòng nhân sự", "👩‍🔬 Research team": "👩‍🔬 Team nghiên cứu", "💹 Finance team": "💹 Phòng tài chính", "💻 IT team": "💻 Phòng IT", "📣 Marketing team": "📣 Phòng marketing", "🚚 Operations team": "🚚 Phòng vận hành", "📦 Packaging line installed: roasted beans become 500 g bags ($0.40 per bag).": "📦 Đã có dây chuyền đóng gói: cà phê rang được đóng bịch 500 g ($0.40 mỗi bịch).", "📹 Camera an ninh": "📹 Camera an ninh", "🔍 Search your ingredients": "🔍 Tìm nguyên liệu", "🧪 Invent new items 💡": "🧪 Sáng chế món mới 💡", "Open 7am to 3pm. Customers order from the real Saigonesee menu: phin coffee, matcha, bánh mì, spring rolls and vermicelli bowls.": "Mở cửa từ 7 giờ sáng tới 3 giờ chiều. Khách gọi món từ menu thật của Saigonesee: cà phê phin, matcha, bánh mì, gỏi cuốn và bún.", "Cool highlands for Arabica and Moka. Best for Arabica Catimor and Moka (Typica) (+25% harvest).": "Cao nguyên mát cho Arabica và Moka. Hợp nhất với Arabica Catimor và Moka (+25% sản lượng).", "Northern mountains, bright Arabica. Best for Arabica Catimor and Culi (peaberry) (+25% harvest).": "Núi rừng phía Bắc, Arabica sáng vị. Hợp nhất với Arabica Catimor và Culi (+25% sản lượng).", "Red basalt soil, great for Robusta. Best for Robusta and Culi (peaberry) (+25% harvest).": "Đất đỏ bazan, rất hợp Robusta. Hợp nhất với Robusta và Culi (+25% sản lượng).", "Vietnam's Robusta capital. Best for Robusta and Excelsa (cà phê mít) (+25% harvest).": "Thủ phủ Robusta của Việt Nam. Hợp nhất với Robusta và Excelsa (cà phê mít) (+25% sản lượng).", "Go public (IPO)": "Lên sàn (IPO)", "Law office in Quincy": "Văn phòng luật ở Quincy"}).forEach(([a,b])=>VI_EXACT.set(a,b));
